t of Ruined Forge of Starfall Past along the cliffside. NOTE: You can lock yourself out of the Forager Brood Cookbooks if Moore dies during his questline, and will not be able to pick them up anymore.","",0],["abf09ed5",15,14,"Forager Brood Cookbook","Forager Brood Cookbook","Scadu Altus","2. Given by a Non-hostile Servant of Rot. From the pond located to the east of the Cliffroad Terminus Site of Grace, exactly all the way south on the map. It may require certain well-timed jumps from Torrent. NOTE: You can lock yourself out of the Forager Brood Cookbooks if Moore dies during his questline, and will not be able to pick them up anymore.","",0],["4885fdbe",15,14,"Forager Brood Cookbook","Forager Brood Cookbook","Scadu Altus","3. Acquired from a pest who hands it to you if you interact with it at the north-east corner of the forest of lightning rams near the Furnace Golem on the Ellac River. Closest Site of Grace is Cerulean Coast. NOTE: You can lock yourself out of the Forager Brood Cookbooks if Moore dies during his questline, and will not be able to pick them up anymore.","",0],["1e67a2dc",15,14,"Forager Brood Cookbook","Forager Brood Cookbook","Scadu Altus","4. Acquired by interacting with a pest found north of Church of the Crusade. The pest will be found shivering and unresponsive. Use a Warming Stone or Sunwarmth Stone to warm it up, and reload the area by teleporting or logging out. It can now be interacted with and will grant the cookbook. NOTE: You can lock yourself out of the Forager Brood Cookbooks if Moore dies during his questline, and will not be able to pick them up anymore.","",0],["733823ac",15,14,"Forager Brood Cookbook","Forager Brood Cookbook","Scadu Altus","5. Acquired by interacting with the pest found along the right cliff edge in the Deathbird-infested poisonous swamp north of Moorth ruins. The swamp can be reached by going through the cave with the Miranda flowers and Perfumers. NOTE: You can lock yourself out of the Forager Brood Cookbooks if Moore dies during his questline, and will not be able to pick them up anymore.","",0],["7ad0c02a",15,14,"Forager Brood Cookbook","Forager Brood Cookbook","Shadow Keep","6. Acquired by interacting with the pest found east outside of the Shadow Keep. It can be accessed from the Church District Highroad site of grace and traveling West up the cliff above the tunnel road, then continuing West to the outer wall of the keep. NOTE: You can lock yourself out of the Forager Brood Cookbooks if Moore dies during his questline, and will not be able to pick them up anymore.","",0],["485c95b3",15,14,"Forager Brood Cookbook","Forager Brood Cookbook","Belurat & Gravesite Plain","7. Acquired by selecting the option \"Talk to Moore\" when speaking with Moore. Requires having all of the other Forager Brood Cookbooks. NOTE: You can lock yourself out of the Forager Brood Cookbooks if Moore dies during his questline, and will not be able to pick them up anymore.","",0],["7c321fe6",15,14,"Igon's Cookbook","Igon's Cookbook","Belurat & Gravesite Plain","1. Can be found on a corpse in the broken tower just before the Grand Altar of Dragon Communion.","",0],["6c183f1f",15,14,"Igon's Cookbook","Igon's Cookbook","Cerulean Coast & Jagged Peak","2. Can be found at the edge of a cliff near the Jagged Peak Mountainside site of grace.","",0],["5097461",15,14,"Finger-Weaver's Cookbook","Finger-Weaver's Cookbook","Cerulean Coast & Jagged Peak","1. Found at Finger-Weaver's Hovel. Accessible via Finger Ruins of Rhia following the path to the left and heading straight underneath the Grand Altar of Dragon Communion.","",0],["7427d77b",15,14,"Finger-Weaver's Cookbook","Finger-Weaver's Cookbook","Scadu Altus","2. Found on a corpse before the bell in Finger Ruins of Miyr. Only accessible after progressing Ymir's questline and finding the secret path under the Catherdal.","",0],["ddff6d9d",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Belurat & Gravesite Plain","1. Scorched Ruins: From the Hefty Cracked Pot, just head right until a set of stairs is on your left. Take them and continue forward to find the cookbook.","",0],["e89dbc52",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Belurat & Gravesite Plain","2. Looted from a body that's inside the Run-Down Traveler's Rest location.","",0],["a4eb5ccc",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Belurat & Gravesite Plain","3. Across the wooden bridge heading west from Fog Rift Fort, just after the first small tower.","",0],["b6c8d6c5",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Scadu Altus","4. East of Cathedral of Manu Metyr. Can be found on a corpse sitting on the ground, surrounded by multiple Marionette Soldiers.","",0],["6dd4bcf9",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Belurat & Gravesite Plain","5. Found in the forest area, there are two thunder cows in the area. From Prospect Town, just follow the cliff south to find it.","",0],["b1e9f1ff",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Cerulean Coast & Jagged Peak","6. Found on a cliff edge corpse north of the spiritspring used to launch up towards the Foot of the Jagged Peak grace.","",0],["5b75c5c5",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Shadow Keep","7. Found in the swamp area, on the east side of the area where the Bloodfiends and Messmer soldiers are fighting. A Giant Poison Miranda Sprout and several smaller ones protect it. It allows you to create a Hefty Poison Pot.","",0],["c96a14a4",16,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","","9. After getting past the scarlet rot swamp area, head outside and you'll find this item on a corpse near the wall.","",0],["afd51d62",16,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","","10. The item is looted from a body that is inside a dilapidated building. You can use your mount to jump onto the roof where you'll find a hole that you can jump through.","",0],["93762563",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Belurat & Gravesite Plain","11. Belurat Gaol: Found within the jar labyrinth.","",0],["3f32f4ed",16,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","","12. To find the book, descend from the top of the waterfall using the rocks as steps. The book can be looted from a corpse leaning on one of the elevated rocks.","",0],["e73007fd",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Belurat & Gravesite Plain","13. Ruined Forge Lava Intake. Take the first ladder down, and go up the set of stairs on the right, you will find it on a body near the back wall. This cookbook allows you to craft a Hefty Volcano Pot.","",0],["dd360547",15,14,"Greater Potentate's Cookbook","Greater Potentate's Cookbook","Cerulean Coast & Jagged Peak","14. Going through the north-west path from the Charo's Hidden Grave grace, hug the water to the left until you stumble upon a corpse holding the cookbook, guarded by a large poison Miranda Flower and several smaller Miranda Flowers.","",0],["1dfcd3a",15,14,"Ancient Dragon Knight's Cookbook","Ancient Dragon Knight's Cookbook","Belurat & Gravesite Plain","1. Fog Rift Catacombs. After the room with the sorcerer, the path opens up. Take the right side first, fight the two goblins and grab this item from the ground.","",0],["21a4b72",15,14,"Ancient Dragon Knight's Cookbook","Ancient Dragon Knight's Cookbook","Rauh & Enir-Ilim","2. Found in a chest in Scorpion River Catacombs. Right after the room with the annoying elevated sorcerer and two imps, you'll come across a bridge patrolled by more death eyes. You can drop off the side onto a path which eventually leads to the chest for this.","",0],["4dde75c0",15,14,"Mad Craftsman's Cookbook","Mad Craftsman's Cookbook","Abyssal Woods & Midra's Manse","1. Abyssal Woods: West from the Divided Falls Site of Grace, up the rocks that lead to the waterfall.","",0],["ada221f1",15,14,"Mad Craftsman's Cookbook","Mad Craftsman's Cookbook","Abyssal Woods & Midra's Manse","2. Abyssal Woods: Found on a corpse among large roots in the upper areas in the middle portion of the map. Access by going west and climbing up. [Elden Ring Map]","",0],["6734735f",15,14,"Mad Craftsman's Cookbook","Mad Craftsman's Cookbook","Abyssal Woods & Midra's Manse","3. Found in Midra's Manse, just before the second site of grace. Walk across the rafters and jump into a room filled with frenzy rats. The cookbook is found on a body in that room.","",0],["28e0dffe",15,14,"St. Trina Disciple's Cookbook","St. Trina Disciple's Cookbook","Cerulean Coast & Jagged Peak","1. Cerulean Coast: From the Cerulean Coast Cross site of grace, head north, across a coffin ship, and while mounted, double jump to the hill with a large wilted tree being guarded by a Cemetery Shade. There will be a sitting corpse under the tree, which holds the Cookbook.","",0],["322fd7e7",15,14,"St. Trina Disciple's Cookbook","St. Trina Disciple's Cookbook","Cerulean Coast & Jagged Peak","2. From Cerulean Coast Cross follow the path south until the very end to the highest cliff of the mountain.","",0],["5ce294d1",15,14,"St. Trina Disciple's Cookbook","St. Trina Disciple's Cookbook","Cerulean Coast & Jagged Peak","3. Found in the Garden of Deep Purple after defeating the Putrescent Knight. The cookbook is inside the small cave nearby.","",0],["767e94c8",15,14,"Fire Knight's Cookbook","Fire Knight's Cookbook","Scadu Altus","1. East of the Highroad Cross Site of Grace, there is a messmer soldiers encampment. On one of the tents you can find this item.","",0],["dbf659df",15,14,"Fire Knight's Cookbook","Fire Knight's Cookbook","Belurat & Gravesite Plain","2. In the soldier camp past Ellac Greatbridge, found inside one of the tents. Beware of the black knight in the area.","",0],["8db9251e",16,14,"Loyal Knight's Cookbook","Loyal Knight's Cookbook","","The Loyal Knight's Cookbook can be fo ook 1].","",0],["e3b96ec6",15,14,"Antiquity Scholar's Cookbook","Antiquity Scholar's Cookbook","Rauh & Enir-Ilim","2. From the entrance of the Ancient Ruins of Rauh, head north towards the edge, and head west, you will find an area with an item below in which you can jump.","",0],["9817b1fe",15,14,"Tibia's Cookbook","Tibia's Cookbook","Cerulean Coast & Jagged Peak","Dropped by Tibia Mariner upon defeat, located west of Finger-Weaver's Hovel.","",0],["92b033d0",2,15,"NPCs' Bell Bearings","Gostoc","Stormveil Castle","Gostoc never becomes hostile. To obtain his bell bearing, you must murder him at some point. His shop inventory (and thus his bell bearing) adds a very rare item at the end of his questline, so don't kill him early if you want it.","",0],["f2e75bb8",0,15,"NPCs' Bell Bearings","Patches","Limgrave","Patches never becomes hostile (permanently). To obtain his bell bearing, you must murder him at some point.","",1],["284d71c3",15,16,"Dragon Hearts","Dragon Hearts","Scadu Altus","Defeat Ghostflame Dragon, found North from Fort Reprimand.","",0],["b44fa4b5",15,16,"Dragon Hearts","Dragon Hearts","Cerulean Coast & Jagged Peak","Defeat Ghostflame Dragon, found South of the Cerulean Coast Site of Grace.","",0],["7e61ed86",16,16,"Dragon Hearts","Dragon Hearts","","Defeat Ghostflame Dragon, found west of the Greatbridge, North Site of Grace.","",0],["da02fddb",15,16,"Dragon Hearts","Dragon Hearts","Cerulean Coast & Jagged Peak","Defeat Jagged Peak Drake, found past the Dragon’s Pit Terminus Site of Grace.","",0],["619cfb9c",15,16,"Dragon Hearts","Dragon Hearts","Cerulean Coast & Jagged Peak","Defeat Jagged Peak Drake, found past the Foot of the Jagged Peak Site of Grace.","",0],["df9a934b",15,16,"Dragon Hearts","Dragon Hearts","Cerulean Coast & Jagged Peak","Dragon's Pit: Dropped by the Magma Wyrm mini boss in the area.","",0],["16c202b4",16,17,"Larval Tears","Larval Tears","","Among the rewards of the Resurrection painting.","",0],["a65e044f",16,17,"Larval Tears","La ound in a small cave north-east from Scorched Ruins in","",0],["c46df9cf",16,21,"Painting Locations","Domain of Dragons Painting","","Bottom part of keep, accessing by climbing down ladders from main plaza","",0]],"chars":["White Mask Varré","Kalé","Melina","Ranni","Blaidd","Iji","Seluvis","Boc the Seamster","Iron Fist Alexander","D, Hunter of the Dead","Kenneth Haight","Roderika","Sorceress Sellen","Bloody Finger Hunter Yura","Knight Bernahl","Patches","Irina & Edgar","Gatekeeper Gostoc","Rogier","Nepheli Loux","Brother Corhyn & Goldmask","Sir Gideon Ofnir","Diallos","Hyetta & Shabriri","Thops","Pidia","Rya & Volcano Manor","Blackguard Big Boggart","Albus","Latenna","Millicent & Gowry","Gurranq","Miriel","Fia","Dung Eater","Jar-Bairn & Great Jar","Ensha","Blacksmith Hewg","Finger Reader Enia","Needle Knight Leda","Sir Ansbach","Redmane Freyja","Moore","Hornsent Grandam","Hornsent","Thiollier & St. Trina","Count Ymir & Jolán","Igon","Dryleaf Dane","Fire Knight Queelign","Main path & other steps"]}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const TABS = D.tabs, CATS = D.cats, ROWS = D.rows, CHARS = D.chars || [];
  const MAINC = CHARS.length - 1;
  // row: [id, tab, cat, type, name, area, where, notes, warn]
  const byTab = TABS.map(() => []);
  ROWS.forEach((r, i) => byTab[r[1]].push(i));
  const QUEST = 0;
  const stepNo = new Map(); { let a = 0, b = 0; ROWS.forEach((r, i) => { if (r[2] === QUEST) stepNo.set(i, r[1] === 15 ? ++b : ++a); }); }

  const LS = "er-ledger-v1";
  const ls = { get(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
               set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} } };

  let done = new Set(ls.get(":done", []));
  const ui = { view: ls.get(":view", -1), cat: -1, q: "", hide: ls.get(":hide", false), limit: 400, open: new Set(ls.get(":npc", [])) };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (a, b) => b ? Math.floor(a / b * 100) : 0;
  const countTab = t => { let d = 0; for (const i of byTab[t]) if (done.has(ROWS[i][0])) d++; return d; };

  const reduce = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } })();
  const restart = (el, cls) => { if (!el || reduce) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  let shown = done.size, raf = 0;
  const paintTally = v => { $("tally").innerHTML = `<b>${v.toLocaleString()}</b> / ${ROWS.length.toLocaleString()} · ${pct(v, ROWS.length)}%`; };
  function animateTally(to) {
    const from = shown;
    cancelAnimationFrame(raf);
    if (reduce || from === to) { shown = to; paintTally(to); return; }
    restart($("tally"), "bump");
    if (to > from) restart($("totalBar").parentElement, "gain");
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1 - p, 3);
      shown = Math.round(from + (to - from) * e); paintTally(shown);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function burst(box) {
    if (reduce || !box) return;
    const b = document.createElement("span"); b.className = "burst";
    for (let k = 0; k < 9; k++) {
      const s = document.createElement("i");
      s.style.setProperty("--a", (k * 40 + Math.random() * 25) + "deg");
      s.style.setProperty("--r", (20 + Math.random() * 14) + "px");
      b.appendChild(s);
    }
    box.parentElement.appendChild(b);
    setTimeout(() => b.remove(), 700);
  }
  function banner(title, sub) {
    const el = document.createElement("div"); el.className = "banner"; el.setAttribute("role", "status");
    el.innerHTML = `<b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), reduce ? 1800 : 2900);
  }

  function header() {
    const n = done.size, t = ROWS.length;
    animateTally(n);
    $("totalBar").style.width = pct(n, t) + "%";
    $("hide").setAttribute("aria-pressed", ui.hide);
    const chips = [`<button class="chip" data-view="-1" aria-pressed="${ui.view === -1 && !ui.q}">Overview</button>`];
    TABS.forEach((tb, t) => chips.push(`<button class="chip" data-view="${t}" aria-pressed="${ui.view === t && !ui.q}">${esc(tb[0])} <small>${pct(countTab(t), byTab[t].length)}%</small></button>`));
    $("strip").innerHTML = chips.join("");
    const act = $("strip").querySelector('[aria-pressed="true"]');
    if (act) act.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function rowHTML(i, showTab) {
    const r = ROWS[i], isDone = done.has(r[0]), quest = r[2] === QUEST;
    const meta = [];
    if (quest) meta.push(`<span class="step">${r[1] === 15 ? "DLC step" : "Step"} ${stepNo.get(i)}</span>`);
    if (quest && showTab && r[9] !== MAINC && CHARS[r[9]]) meta.push(esc(CHARS[r[9]]));
    if (showTab) meta.push(esc(TABS[r[1]][0]));
    if (showTab) meta.push(esc(CATS[r[2]][0]));
    if (r[3] && (showTab || !isGrouped(r[2]))) meta.push(esc(r[3]));
    if (r[5] && r[5] !== TABS[r[1]][0]) meta.push(esc(r[5]));
    let note = "";
    if (r[8]) note = `<div class="note warn">⚠ ${esc(r[7] || "Choice or timing matters here – read before acting")}</div>`;
    else if (r[7]) note = `<div class="note">${esc(r[7])}</div>`;
    return `<div class="row${isDone ? " done" : ""}${quest ? " quest" : ""}" data-i="${i}">
      <input type="checkbox" id="c${r[0]}" ${isDone ? "checked" : ""} aria-label="Mark ${esc(r[4]).slice(0, 80)} done">
      <div class="body"><div class="nm"><span class="nmt">${esc(r[4])}</span></div>${meta.length ? `<div class="meta">${meta.join("<span>·</span>")}</div>` : ""}${r[6] ? `<div class="where">${esc(r[6])}</div>` : ""}${note}</div>
    </div>`;
  }

  function overview() {
    const cards = TABS.map((tb, t) => {
      const d = countTab(t), n = byTab[t].length;
      return `<button class="region${d === n ? " complete" : ""}" data-view="${t}">
        <div class="rn"><span>${esc(tb[0])}</span><em>${d}/${n}</em></div>
        <div class="bar"><i style="width:${pct(d, n)}%"></i></div>
        <p>${esc(tb[1])}</p></button>`;
    }).join("");
    return `<div class="intro"><h2>The Lands Between, region by region</h2>
      <p>Each region starts with its side-quest steps in order, then bosses, gear, spells, spirit ashes and upgrades. Tick things off as you go.</p></div>
      <div class="regions">${cards}</div>
      <div class="foot">
        <div>Quest steps that send you back to earlier areas are listed where the step happens and numbered in play order. Red ⚠ notes flag choices that can lock you out of something.</div>
        <div>Data: <a href="https://roundtablehold.net/" target="_blank" rel="noopener">Roundtable Guides</a> community checklists (GPL-3.0). DLC boss list from Samurai Gamers. A few gear locations were matched to regions automatically, so some may sit in a neighbouring region.</div>
        <div>Your progress is saved on this device. Back it up now and then, or use it to move progress to another phone.</div>
        <div class="backup">
          <button class="danger" id="export">Save backup file</button>
          <label class="danger" for="importFile">Load backup file</label>
          <input id="importFile" type="file" accept=".json,application/json" hidden>
        </div>
        <p class="cat-note" id="backupMsg" role="status"></p>
        <button class="danger" id="reset">Reset all progress</button>
      </div>`;
  }

  // Categories shown as collapsible cards: quests by character, weapons by type, armor by set.
  const CAT_IDX = name => CATS.findIndex(c => c[0] === name);
  const WEAPON = CAT_IDX("Weapon"), ARMOR = CAT_IDX("Armor");
  const GROUP_NOTE = {
    [QUEST]: "Grouped by character. Each card lists that character's steps in order; step numbers show the order across the whole game.",
    [WEAPON]: "Grouped by weapon type. Shields are in here too.",
    [ARMOR]: "Grouped by armor set.",
  };
  const isGrouped = c => (c === QUEST && CHARS.length > 0) || c === WEAPON || c === ARMOR;
  const groupOf = i => { const r = ROWS[i]; return r[2] === QUEST ? "q" + r[9] : (r[2] === WEAPON ? "w" : "a") + (r[3] || "Other"); };
  const groupLabel = g => g[0] === "q" ? CHARS[+g.slice(1)] : g.slice(1);
  const groupRows = (t, g) => byTab[t].filter(i => isGrouped(ROWS[i][2]) && groupOf(i) === g);
  const MAIN_GROUP = "q" + MAINC;

  function cardGroups(t, c, rs) {
    const order = [];
    for (const i of rs) { const g = groupOf(i); if (!order.includes(g)) order.push(g); }
    if (c === QUEST) order.sort((a, b) => (a === MAIN_GROUP) - (b === MAIN_GROUP));   // when you meet them; leftovers last
    else order.sort((a, b) => groupLabel(a).localeCompare(groupLabel(b)));
    const cards = order.map(g => {
      const gr = rs.filter(i => groupOf(i) === g);
      const gd = gr.filter(i => done.has(ROWS[i][0])).length;
      const shown = ui.hide ? gr.filter(i => !done.has(ROWS[i][0])) : gr;
      if (!shown.length) return "";
      const key = `${t}:${g}`;
      return `<details class="npc${g === MAIN_GROUP ? " main" : ""}${gd === gr.length ? " complete" : ""}" data-npc="${esc(key)}"${ui.open.has(key) ? " open" : ""}>
        <summary><span class="npc-name">${esc(groupLabel(g))}</span>
          <span class="npc-meta"><span class="mini"><i style="width:${pct(gd, gr.length)}%"></i></span><span data-nc="${esc(key)}">${gd} / ${gr.length}</span></span></summary>
        <div class="npc-body">${shown.map(i => rowHTML(i, false)).join("")}</div></details>`;
    }).join("");
    const allOpen = order.every(g => ui.open.has(`${t}:${g}`));
    return `<div class="npc-tools"><p class="cat-note">${GROUP_NOTE[c]}</p>
      <button class="linkbtn" data-npcall="${t}:${c}">${allOpen ? "Close all" : "Open all"}</button></div>${cards}`;
  }

  function regionView(t) {
    const idx = byTab[t];
    const present = [...new Set(idx.map(i => ROWS[i][2]))].sort((a, b) => a - b);
    if (ui.cat !== -1 && !present.includes(ui.cat)) ui.cat = -1;
    const d = countTab(t);
    const catChips = [`<button class="chip" data-cat="-1" aria-pressed="${ui.cat === -1}">All</button>`]
      .concat(present.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${ui.cat === c}">${esc(CATS[c][0])}</button>`)).join("");
    let html = `<div class="intro"><h2>${esc(TABS[t][0])}</h2><p>${esc(TABS[t][1])} · ${d} of ${idx.length} done</p></div>
      <div class="cats">${catChips}</div>`;
    let any = false;
    for (const c of present) {
      if (ui.cat !== -1 && ui.cat !== c) continue;
      const rs = idx.filter(i => ROWS[i][2] === c);
      const cd = rs.filter(i => done.has(ROWS[i][0])).length;
      const shown = ui.hide ? rs.filter(i => !done.has(ROWS[i][0])) : rs;
      if (!shown.length && ui.hide) continue;
      any = true;
      const head = `<div class="cat-h"><h3>${esc(CATS[c][1])}</h3><span data-cc="${t}:${c}">${cd} / ${rs.length}</span></div>`;
      if (isGrouped(c)) {
        html += `<section class="cat">${head}${cardGroups(t, c, rs)}</section>`;
      } else {
        html += `<section class="cat">${head}${shown.map(i => rowHTML(i, false)).join("")}</section>`;
      }
    }
    if (!any) html += `<p class="empty">${ui.hide ? "Everything here is done. ✦" : "Nothing listed here."}</p>`;
    return html;
  }

  function searchView() {
    const words = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = [];
    for (let i = 0; i < ROWS.length; i++) {
      const r = ROWS[i];
      if (ui.hide && done.has(r[0])) continue;
      const hay = (r[4] + " " + r[3] + " " + r[5] + " " + r[6] + " " + TABS[r[1]][0] + " " + CATS[r[2]][0]).toLowerCase();
      if (words.every(w => hay.includes(w))) hits.push(i);
    }
    hits.sort((a, b) => (ROWS[b][4].toLowerCase().includes(words[0]) ? 1 : 0) - (ROWS[a][4].toLowerCase().includes(words[0]) ? 1 : 0));
    const shown = hits.slice(0, ui.limit);
    return `<div class="intro"><h2>“${esc(ui.q)}”</h2><p>${hits.length} match${hits.length === 1 ? "" : "es"} across all regions</p></div>
      <section class="cat">${shown.map(i => rowHTML(i, true)).join("") || `<p class="empty">No matches. Try a shorter word.</p>`}</section>
      ${hits.length > shown.length ? `<button class="more" id="more">Show more (${hits.length - shown.length} left)</button>` : ""}`;
  }

  function render(scrollTop) {
    header();
    const main = $("main");
    main.innerHTML = ui.q ? searchView() : ui.view === -1 ? overview() : regionView(ui.view);
    document.documentElement.style.setProperty("--hh", $("top").offsetHeight + "px");
    if (scrollTop) {
      window.scrollTo({ top: 0 });
      // stagger only what's on screen; rows further down appear without delay
      main.querySelectorAll(".row").forEach((r, k) => { if (k < 16) r.style.setProperty("--i", k); else r.style.setProperty("--i", 0); });
      main.querySelectorAll(".region").forEach((r, k) => r.style.setProperty("--i", k));
      restart(main, "enter");
      clearTimeout(render.t); render.t = setTimeout(() => main.classList.remove("enter"), 1600);
    }
  }

  function toggle(i, on) {
    const id = ROWS[i][0];
    on ? done.add(id) : done.delete(id);
    const el = $("main").querySelector(`.row[data-i="${i}"]`);
    if (el) el.classList.toggle("done", on);
    if (on && el) {
      restart(el, "flash");
      burst(el.querySelector("input"));
      try { navigator.vibrate && navigator.vibrate(12); } catch {}
      if (ui.hide) {
        if (reduce) el.remove();
        else { el.style.maxHeight = el.offsetHeight + "px"; el.classList.add("leaving"); setTimeout(() => el.remove(), 430); }
      }
    }
    const r = ROWS[i], cc = $("main").querySelector(`[data-cc="${r[1]}:${r[2]}"]`);
    const rs = byTab[r[1]].filter(j => ROWS[j][2] === r[2]);
    const cd = rs.filter(j => done.has(ROWS[j][0])).length;
    if (cc) {
      cc.textContent = `${cd} / ${rs.length}`;
      const h = cc.closest(".cat-h");
      if (on && cd === rs.length) restart(h, "win"); else if (!on) h.classList.remove("win");
    }
    if (isGrouped(r[2])) {
      const gk = groupOf(i), key = `${r[1]}:${gk}`;
      const nc = [...$("main").querySelectorAll("[data-nc]")].find(n => n.dataset.nc === key);
      if (nc) {
        const g = groupRows(r[1], gk), gd = g.filter(j => done.has(ROWS[j][0])).length;
        nc.textContent = `${gd} / ${g.length}`;
        const card = nc.closest(".npc");
        card.querySelector(".mini i").style.width = pct(gd, g.length) + "%";
        card.classList.toggle("complete", gd === g.length);
        if (on && gd === g.length) {
          restart(card.querySelector("summary"), "win");
          if (ui.hide) setTimeout(() => { if (!card.querySelector(".row:not(.leaving)")) card.remove(); }, reduce ? 0 : 450);
        }
      }
    }
    const intro = $("main").querySelector(".intro p");
    if (intro && !ui.q && ui.view >= 0) intro.textContent = `${TABS[ui.view][1]} · ${countTab(ui.view)} of ${byTab[ui.view].length} done`;
    header();
    persist();
    const cleared = on && (done.size === ROWS.length || countTab(r[1]) === byTab[r[1]].length);
    if (cleared) Music.fanfare(); else Music.chime(on);
    if (on) {
      if (done.size === ROWS.length) banner("Lands Between complete", "Every item, every boss, every quest");
      else if (countTab(r[1]) === byTab[r[1]].length) banner(TABS[r[1]][0] + " cleared", "Region complete");
    }
  }

  // ---- background music: original ambient piece generated live with Web Audio ----
  // D minor. A low drone, a slow choir-like pad through a chord cycle, sparse harp notes with echo,
  // and a distant bell now and then. Nothing is a recording, so it never repeats the same way.
  const Music = (() => {
    let ctx = null, master = null, wet = null, dry = null, echo = null, timers = [], playing = false, nextChord = 0, chordIdx = 0;
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);                 // MIDI note -> frequency
    const CHORDS = [[50, 53, 57, 62], [46, 50, 53, 58], [48, 52, 55, 60], [45, 49, 52, 57],   // Dm  Bb  C  A
                    [50, 53, 57, 60], [43, 46, 50, 55], [46, 50, 53, 57], [45, 48, 52, 57]];  // Dm7 Gm  Bb  Am
    const SCALE = [62, 64, 65, 67, 69, 70, 72, 74, 76, 77, 81];         // D natural minor, upper register
    function impulse(sec, decay) {
      const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
      return buf;
    }
    function build() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
      master.connect(comp).connect(ctx.destination);
      const verb = ctx.createConvolver(); verb.buffer = impulse(5, 3.2);
      wet = ctx.createGain(); wet.gain.value = 0.55; dry = ctx.createGain(); dry.gain.value = 0.6;
      verb.connect(wet).connect(master); dry.connect(master);
      echo = ctx.createDelay(2); echo.delayTime.value = 0.46;
      const fb = ctx.createGain(); fb.gain.value = 0.38; const eqf = ctx.createBiquadFilter(); eqf.type = "lowpass"; eqf.frequency.value = 2200;
      echo.connect(eqf).connect(fb).connect(echo); eqf.connect(verb);
      dry.connect(verb);
      // drone: root + fifth, slowly breathing
      [[38, "sine", 0.16], [45, "sine", 0.07], [26, "triangle", 0.08]].forEach(([m, type, g]) => {
        const o = ctx.createOscillator(), gn = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain(), f = ctx.createBiquadFilter();
        o.type = type; o.frequency.value = hz(m); f.type = "lowpass"; f.frequency.value = 500;
        gn.gain.value = g; lfo.frequency.value = 0.05 + Math.random() * 0.05; lg.gain.value = g * 0.45;
        lfo.connect(lg).connect(gn.gain); o.connect(f).connect(gn).connect(dry); o.start(); lfo.start();
      });
    }
    function pad(notes, t, dur) {
      notes.forEach(m => [-6, 6].forEach(cents => {
        const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        o.type = "sawtooth"; o.frequency.value = hz(m); o.detune.value = cents + (Math.random() * 4 - 2);
        f.type = "lowpass"; f.frequency.setValueAtTime(380, t); f.frequency.linearRampToValueAtTime(950, t + dur * 0.5); f.frequency.linearRampToValueAtTime(420, t + dur); f.Q.value = 2;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.018, t + 3.2); g.gain.setValueAtTime(0.018, t + dur - 3); g.gain.linearRampToValueAtTime(0, t + dur + 1.5);
        o.connect(f).connect(g); g.connect(dry);
        o.start(t); o.stop(t + dur + 2);
      }));
    }
    function pluck(m, t, vol = 0.09) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = "triangle"; o.frequency.value = hz(m); o2.type = "sine"; o2.frequency.value = hz(m) * 2;
      f.type = "lowpass"; f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(700, t + 1.2);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
      const g2 = ctx.createGain(); g2.gain.value = 0.25;
      o.connect(f); o2.connect(g2).connect(f); f.connect(g); g.connect(dry); g.connect(echo);
      o.start(t); o2.start(t); o.stop(t + 3); o2.stop(t + 3);
    }
    function bell(m, t, vol = 0.05) {
      [1, 2.76, 5.4, 8.93].forEach((r, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = hz(m) * r;
        const v = vol / (k + 1), len = 6 / (k + 1);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g); g.connect(dry); g.connect(echo); o.start(t); o.stop(t + len + 0.1);
      });
    }
    function scheduler() {
      if (!playing) return;
      const now = ctx.currentTime;
      while (nextChord < now + 1) {
        const ch = CHORDS[chordIdx % CHORDS.length]; chordIdx++;
        const dur = 9 + (chordIdx % 2) * 3;
        pad(ch, nextChord, dur);
        // a few harp notes over this chord, leaning on chord tones
        let t = nextChord + 1.5 + Math.random() * 2;
        while (t < nextChord + dur - 1) {
          if (Math.random() < 0.72) {
            const pool = Math.random() < 0.6 ? ch.map(n => n + 12 + (Math.random() < 0.3 ? 12 : 0)) : SCALE;
            pluck(pool[Math.floor(Math.random() * pool.length)], t, 0.05 + Math.random() * 0.05);
            if (Math.random() < 0.25) pluck(pool[Math.floor(Math.random() * pool.length)], t + 0.18, 0.04);
          }
          t += 0.9 + Math.random() * 2.2;
        }
        if (chordIdx % 3 === 0) bell(ch[0] + 24, nextChord + 4 + Math.random() * 3);
        nextChord += dur;
      }
      timers.push(setTimeout(scheduler, 500));
    }
    return {
      get playing() { return playing; },
      async start() {
        try {
          if (!ctx) build();
          await ctx.resume();
          playing = true; nextChord = Math.max(nextChord, ctx.currentTime + 0.1);
          master.gain.cancelScheduledValues(ctx.currentTime);
          master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
          master.gain.linearRampToValueAtTime(0.8, ctx.currentTime + 3);   // slow fade in
          scheduler();
          return true;
        } catch { playing = false; return false; }
      },
      stop() {
        if (!ctx) return;
        playing = false; timers.forEach(clearTimeout); timers = [];
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
        setTimeout(() => { if (!playing) ctx.suspend(); }, 1400);
      },
      chime(up = true) {                         // soft two-note chime when you tick something
        if (!ctx || !playing) return;
        const t = ctx.currentTime + 0.01, root = 74 + (Math.random() < 0.5 ? 0 : 3);
        if (up) { pluck(root, t, 0.11); pluck(root + 7, t + 0.09, 0.09); pluck(root + 12, t + 0.18, 0.07); }
        else pluck(root - 5, t, 0.05);
      },
      fanfare() { if (ctx && playing) { const t = ctx.currentTime + 0.05; bell(62, t, 0.09); [74, 77, 81, 86].forEach((m, k) => pluck(m, t + 0.25 + k * 0.14, 0.1)); } },
      pause() { if (ctx && playing) ctx.suspend(); },
      resume() { if (ctx && playing) ctx.resume(); },
    };
  })();

  function setMusicButton(on) { const b = $("music"); b.setAttribute("aria-pressed", on); b.title = on ? "Music on – tap to stop" : "Background music"; }
  $("music").addEventListener("click", async () => {
    if (Music.playing) { Music.stop(); setMusicButton(false); ls.set(":music", false); }
    else { const ok = await Music.start(); setMusicButton(ok); ls.set(":music", ok); }
  });
  // phones only allow sound after a tap: if music was on last time, start it on the first tap anywhere
  if (ls.get(":music", false)) {
    const kick = async e => {
      if (e.target.closest && e.target.closest("#music")) return;
      document.removeEventListener("pointerdown", kick, true);
      if (!Music.playing && await Music.start()) setMusicButton(true);
    };
    document.addEventListener("pointerdown", kick, true);
  }
  document.addEventListener("visibilitychange", () => document.hidden ? Music.pause() : Music.resume());

  // ---- item detail sheet ----
  const DLC_TAB = TABS.findIndex(t => t[0].startsWith("DLC"));
  let detailsP = null; const packs = {};
  const loadJSON = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); });
  const loadDetails = () => detailsP || (detailsP = Promise.all([loadJSON("details.json"), loadJSON("icon-index.json")])
    .catch(e => { detailsP = null; throw e; }));
  const loadPack = n => packs[n] || (packs[n] = loadJSON(`icons-${n}.json`).catch(e => { delete packs[n]; throw e; }));
  const STAT = { Phy: "Physical", Mag: "Magic", Magic: "Magic", Fire: "Fire", Ligt: "Lightning", Holy: "Holy", Crit: "Critical",
    Boost: "Guard boost", Strike: "Strike", Slash: "Slash", Pierce: "Pierce", Immunity: "Immunity", Robustness: "Robustness",
    Focus: "Focus", Vitality: "Vitality", Poise: "Poise" };
  const ATTR = { Str: "Strength", Dex: "Dexterity", Int: "Intelligence", Fai: "Faith", Arc: "Arcane" };
  const statRows = (list, cap) => `<div class="sh-stats">${list.map(([n, v], k) =>
    `<div class="sh-stat" style="--k:${k}"><span>${esc(STAT[n] || n)}</span><span class="tr"><i style="--v:${Math.min(100, Math.round(v / cap * 100))}%"></i></span><b>${esc(v)}</b></div>`).join("")}</div>`;
  const sec = (title, body) => body ? `<div class="sh-sec"><h4>${esc(title)}</h4>${body}</div>` : "";
  let sheetRow = -1, lastFocus = null;

  function sheetHTML(i, det) {
    const r = ROWS[i], isDone = done.has(r[0]), cat = CATS[r[2]][0];
    const sub = [det && det.k ? det.k : (r[3] || cat), TABS[r[1]][0]].filter(Boolean);
    let body = "";
    if (det) {
      if (det.req && det.req.length) body += sec("Requirements", `<div class="sh-chips">${det.req.map(([a, v]) => `<span class="sh-chip">${esc(ATTR[a] || a)}<b>${esc(v)}</b></span>`).join("")}</div>`);
      if (det.fp != null || det.sl != null || det.hp) body += sec("Cost", `<div class="sh-chips">${det.fp != null ? `<span class="sh-chip">FP<b>${esc(det.fp)}</b></span>` : ""}${det.hp && det.hp !== "0" ? `<span class="sh-chip">HP<b>${esc(det.hp)}</b></span>` : ""}${det.sl != null ? `<span class="sh-chip">Memory slots<b>${esc(det.sl)}</b></span>` : ""}</div>`);
      if (det.fx) body += sec("Effect", `<p class="sh-fx">${esc(det.fx)}</p>`);
      if (det.af || det.sk) body += sec("Skill", `<div class="sh-chips">${det.sk ? `<span class="sh-chip">${esc(det.sk)}</span>` : ""}${det.af ? `<span class="sh-chip">Affinity<b>${esc(det.af)}</b></span>` : ""}</div>`);
      if (det.atk && det.atk.length) body += sec("Attack power", statRows(det.atk, 200));
      if (det.sc && det.sc.length) body += sec("Scaling", `<div class="sh-chips">${det.sc.map(([a, g]) => `<span class="sh-chip">${esc(ATTR[a] || a)}<span class="sh-grade">${esc(g)}</span></span>`).join("")}</div>`);
      if (det.grd && det.grd.length) body += sec("Guarded damage negation", statRows(det.grd, 100));
      if (det.neg && det.neg.length) body += sec("Damage negation", statRows(det.neg, 16));
      if (det.res && det.res.length) body += sec("Resistance", statRows(det.res, 60));
      if (det.w != null) body += sec("Weight", `<div class="sh-chips"><span class="sh-chip">${esc(det.w)}</span></div>`);
      if (det.d) body += sec("Description", `<p class="sh-desc">${esc(det.d)}</p>`);
    } else if (r[1] === DLC_TAB) {
      body += sec("Stats", `<p class="sh-note">Stats and descriptions for Shadow of the Erdtree items aren't in the open data this checklist uses yet.</p>`);
    }
    if (r[6]) body += sec("Where to find it", `<p class="sh-where">${esc(r[6])}</p>`);
    if (r[7] && !/^Upgrade:/.test(r[7])) body += sec("Notes", `<p class="sh-note">${esc(r[7])}</p>`);
    if (r[7] && /^Upgrade:/.test(r[7])) body += sec("Upgrades with", `<p class="sh-note">${esc(r[7].replace(/^Upgrade:\s*/, ""))} smithing stones</p>`);
    return `<div class="grab" aria-hidden="true"></div>
      <button class="sheet-x" id="shX" aria-label="Close">✕</button>
      <div class="sh-head">
        <div class="sh-icon" id="shIcon"><span class="ph">✦</span></div>
        <div><h3 class="sh-title" id="shTitle">${esc(r[4])}</h3><div class="sh-sub">${sub.map(esc).join(" · ")}</div>
          <button class="sh-done" id="shDone" aria-pressed="${isDone}">${isDone ? "Found ✦" : "Mark as found"}</button></div>
      </div>${body}`;
  }

  async function openSheet(i) {
    sheetRow = i; lastFocus = document.activeElement;
    const sh = $("sheet"), sc = $("scrim");
    let det = null, iconIdx = {};
    try { [/* details */ det, iconIdx] = await loadDetails().then(([d, ix]) => [d[ROWS[i][0]] || null, ix]); } catch {}
    if (sheetRow !== i) return;
    sh.innerHTML = sheetHTML(i, det);
    sh.hidden = false; sc.hidden = false; document.body.classList.add("locked");
    sh.scrollTop = 0;
    requestAnimationFrame(() => { sh.classList.add("on"); sc.classList.add("on"); });
    $("shX").focus({ preventScroll: true });
    const pk = iconIdx[ROWS[i][0]];
    if (pk != null) {
      try {
        const pack = await loadPack(pk);
        if (sheetRow !== i || !pack[ROWS[i][0]]) return;
        const box = $("shIcon"); box.innerHTML = `<img alt="" src="${pack[ROWS[i][0]]}">`; box.classList.add("ready");
      } catch {}
    }
  }
  function closeSheet() {
    if (sheetRow < 0) return;
    sheetRow = -1;
    const sh = $("sheet"), sc = $("scrim");
    sh.classList.remove("on"); sc.classList.remove("on"); document.body.classList.remove("locked");
    setTimeout(() => { if (sheetRow < 0) { sh.hidden = true; sc.hidden = true; } }, reduce ? 0 : 420);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  $("sheet").addEventListener("click", e => {
    if (e.target.id === "shX") { closeSheet(); return; }
    if (e.target.id === "shDone" && sheetRow >= 0) {
      const i = sheetRow, on = !done.has(ROWS[i][0]);
      const box = $("main").querySelector(`.row[data-i="${i}"] input`);
      if (box) box.checked = on;
      toggle(i, on);
      const b = e.target; b.setAttribute("aria-pressed", on); b.textContent = on ? "Found ✦" : "Mark as found";
      if (on) { restart(b, "flash"); try { navigator.vibrate && navigator.vibrate(12); } catch {} }
    }
  });
  // swipe down on the sheet's top area to close (phones)
  let sy = null;
  $("sheet").addEventListener("touchstart", e => { sy = $("sheet").scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  $("sheet").addEventListener("touchmove", e => {
    if (sy == null) return;
    const dy = e.touches[0].clientY - sy;
    if (dy > 0) $("sheet").style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  $("sheet").addEventListener("touchend", e => {
    if (sy == null) return;
    const dy = (e.changedTouches[0].clientY - sy); sy = null;
    $("sheet").style.transform = "";
    if (dy > 90) closeSheet();
  });

  // ---- events ----
  $("main").addEventListener("toggle", e => {
    const d = e.target;
    if (!d.classList || !d.classList.contains("npc")) return;
    d.open ? ui.open.add(d.dataset.npc) : ui.open.delete(d.dataset.npc);
    ls.set(":npc", [...ui.open]);
  }, true);
  $("strip").addEventListener("click", e => {
    const b = e.target.closest("[data-view]"); if (!b) return;
    ui.view = +b.dataset.view; ui.cat = -1; ui.q = ""; $("q").value = ""; ls.set(":view", ui.view); render(true);
  });
  $("main").addEventListener("click", e => {
    const v = e.target.closest(".region[data-view]");
    if (v) { ui.view = +v.dataset.view; ui.cat = -1; ls.set(":view", ui.view); render(true); return; }
    const c = e.target.closest("[data-cat]");
    if (c) { ui.cat = +c.dataset.cat; render(false); return; }
    const all = e.target.closest("[data-npcall]");
    if (all) {
      const cards = [...all.closest("section").querySelectorAll(".npc")];
      const openAll = all.textContent === "Open all";
      cards.forEach(d => { d.open = openAll; openAll ? ui.open.add(d.dataset.npc) : ui.open.delete(d.dataset.npc); });
      ls.set(":npc", [...ui.open]);
      all.textContent = openAll ? "Close all" : "Open all";
      return;
    }
    if (e.target.id === "more") { ui.limit += 400; render(false); return; }
    if (e.target.id === "reset") { resetClick(e.target); return; }
    const body = e.target.closest(".body");
    if (!body) return;
    const row = body.parentElement;
    if (row.classList.contains("quest")) row.classList.toggle("open");
    else openSheet(+row.dataset.i);
  });
  $("main").addEventListener("change", e => {
    if (e.target.type !== "checkbox") return;
    toggle(+e.target.closest(".row").dataset.i, e.target.checked);
  });
  let qt;
  $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { ui.q = e.target.value.trim(); ui.limit = 400; render(true); }, 180); });
  $("hide").addEventListener("click", () => { ui.hide = !ui.hide; ls.set(":hide", ui.hide); render(false); });

  let armT;
  function resetClick(btn) {
    if (!btn.classList.contains("arm")) {
      btn.classList.add("arm"); btn.textContent = "Tap again to erase all ticks";
      clearTimeout(armT); armT = setTimeout(() => { btn.classList.remove("arm"); btn.textContent = "Reset all progress"; }, 4000);
      return;
    }
    done = new Set(); persist(); render(false);
  }

  // ---- persistence: saved on this device ----
  const sync = (s, t) => { $("sync").dataset.s = s; $("sync").textContent = t; };
  function persist() {
    try { localStorage.setItem(LS + ":done", JSON.stringify([...done])); sync("ok", "Saved on this device"); }
    catch { sync("warn", "Couldn't save – your browser is blocking storage (private mode?)"); }
  }
  const msg = t => { const m = $("backupMsg"); if (m) m.textContent = t; };
  document.addEventListener("click", e => {
    if (e.target.id !== "export") return;
    const blob = new Blob([JSON.stringify({ app: "tarnished-ledger", version: 1, saved: new Date().toISOString(), done: [...done] })], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ledger-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    msg(`Backup saved with ${done.size} ticked items.`);
  });
  document.addEventListener("change", async e => {
    if (e.target.id !== "importFile" || !e.target.files[0]) return;
    try {
      const j = JSON.parse(await e.target.files[0].text());
      if (!Array.isArray(j.done)) throw new Error();
      const known = new Set(ROWS.map(r => r[0]));
      done = new Set(j.done.filter(id => known.has(id)));
      persist(); render(false);
      msg(`Backup loaded: ${done.size} ticked items restored.`);
    } catch { msg("That file isn't a Ledger backup. Pick the .json file you saved with 'Save backup file'."); }
    e.target.value = "";
  });

  render(true);
  try { localStorage.setItem(LS + ":probe", "1"); sync("ok", "Saved on this device"); }
  catch { sync("warn", "Progress won't be kept – your browser is blocking storage (private mode?)"); }

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
