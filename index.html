<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarnished's Ledger</title>
<meta name="description" content="Region-by-region Elden Ring 100% checklist">
<meta name="theme-color" content="#13110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: sticky ledger header (progress + region strip + filters) over one scrolling checklist column, max 760px. */
:root {
  --bg: #13110d; --surface: #1c1913; --raise: #252118; --line: #3a3326;
  --fg: #ebe3d0; --muted: #a2967d; --gold: #d6b062; --gold-ink: #1a1408;
  --warn: #e58a6b; --done: #7f765f; --track: #2d281e;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #efede7; --surface: #f8f6f1; --raise: #e6e2d8; --line: #d3ccbc;
  --fg: #221e17; --muted: #6b6150; --gold: #8c6a1c; --gold-ink: #fffaf0;
  --warn: #b24a2a; --done: #9b927f; --track: #ddd7c9; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #efede7; --surface: #f8f6f1; --raise: #e6e2d8; --line: #d3ccbc;
  --fg: #221e17; --muted: #6b6150; --gold: #8c6a1c; --gold-ink: #fffaf0;
  --warn: #b24a2a; --done: #9b927f; --track: #ddd7c9; color-scheme: light; }

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 12px 16px 10px; display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr); }
header.top > * { min-width: 0; }
html, body { overflow-x: clip; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font: 400 1.6rem/1 var(--display); letter-spacing: .02em; margin: 0; }
.tally { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; }
.tally b { color: var(--gold); font-weight: 700; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background-color: var(--gold); width: 0; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.sync { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--gold); }
.sync[data-s="warn"]::before { background: var(--warn); }

.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.strip::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: .88rem; white-space: nowrap; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }

.tools { display: flex; gap: 8px; align-items: center; }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; }
.search::placeholder { color: var(--muted); }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: .88rem; white-space: nowrap; }
.toggle[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

main { display: grid; gap: 18px; padding-top: 18px; }
.intro h2 { font: 400 1.9rem/1.1 var(--display); margin: 0 0 4px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); }
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cats .chip { font-size: .8rem; padding: 3px 10px; }

.regions { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.region { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px;
  display: grid; gap: 8px; }
.region:hover { border-color: var(--gold); }
.region .rn { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.region .rn span { font: 400 1.15rem/1.1 var(--display); }
.region .rn em { font-style: normal; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.region p { margin: 0; font-size: .82rem; color: var(--muted); }
.region.complete .rn span::after { content: " ✦"; color: var(--gold); }

section.cat { display: grid; gap: 0; }
.cat-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0 8px;
  border-bottom: 1px solid var(--gold); position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh, 0px)); background: var(--bg); z-index: 2; }
.cat-h h3 { margin: 0; font: 400 1.05rem/1.2 var(--display); letter-spacing: .06em; color: var(--gold); }
.cat-h span { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat-note { font-size: .82rem; color: var(--muted); padding: 6px 0 2px; margin: 0; }
.npc-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0 4px; }
.npc-tools .cat-note { padding: 0; flex: 1 1 220px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--gold); font-size: .85rem; }
.npc { border-bottom: 1px solid var(--line); }
.npc summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 2px; cursor: pointer; }
.npc summary::-webkit-details-marker { display: none; }
.npc-name { font-weight: 700; display: flex; align-items: center; gap: 12px; min-width: 0; overflow-wrap: anywhere; }
.npc-name::before { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
  transform: rotate(-45deg); transition: transform .25s ease; margin-left: 2px; }
.npc[open] > summary .npc-name::before { transform: rotate(45deg); }
.npc.main .npc-name { color: var(--muted); font-weight: 500; font-style: italic; }
.npc-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; flex: none; }
.mini { width: 52px; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--gold); transition: width .45s cubic-bezier(.2,.8,.2,1); }
.npc.complete .npc-name { color: var(--done); }
.npc.complete .npc-name::after { content: "✦"; color: var(--gold); margin-left: -4px; }
.npc-body { margin: 0 0 12px 6px; padding-left: 16px; border-left: 1px solid var(--line); }
.npc-body .row:last-child { border-bottom: 0; }
.npc[open] > .npc-body { animation: rise .3s cubic-bezier(.2,.8,.2,1); }
.npc summary.win .npc-name { animation: win 1.4s ease; }
.npc summary:active { opacity: .8; }

.row { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line);
  content-visibility: auto; contain-intrinsic-size: auto 64px; }
.row input { appearance: none; width: 24px; height: 24px; margin: 2px 0 0; border: 1.5px solid var(--muted); border-radius: 5px;
  display: grid; place-content: center; cursor: pointer; background: var(--surface); }
.row input::after { content: ""; width: 10px; height: 6px; border: solid var(--gold-ink); border-width: 0 0 2.5px 2.5px;
  transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.row input:checked { background: var(--gold); border-color: var(--gold); }
.row input:checked::after { opacity: 1; }
.body { min-width: 0; cursor: pointer; }
.nm { font-weight: 500; overflow-wrap: anywhere; }
.row.quest .nm { font-weight: 400; }
.meta { font-size: .78rem; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; margin-top: 1px; }
.meta .step { font-variant-numeric: tabular-nums; color: var(--gold); }
.where { font-size: .88rem; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row.open .where { -webkit-line-clamp: unset; display: block; }
.note { font-size: .84rem; margin-top: 4px; color: var(--muted); }
.note.warn { color: var(--warn); font-weight: 500; }
.row.done .nm, .row.done .where { color: var(--done); }
.nmt { background: linear-gradient(var(--done), var(--done)) no-repeat 0 58% / 0% 1.5px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background-size .4s cubic-bezier(.2,.8,.2,1), color .3s; }
.row.done .nmt { background-size: 100% 1.5px; }
.where, .nm, .note { transition: color .3s; }

.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.foot { color: var(--muted); font-size: .82rem; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.foot a { color: var(--gold); }
.danger { justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: .85rem; }
.danger.arm { border-color: var(--warn); color: var(--warn); }
.backup { display: flex; gap: 8px; flex-wrap: wrap; }
.backup .danger { cursor: pointer; }
.more { color: var(--gold); background: none; border: 0; padding: 8px 0; justify-self: start; }
/* ---- music toggle ---- */
.brand-r { display: flex; align-items: center; gap: 10px; }
.music { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 11px 5px 9px; font-size: .8rem; color: var(--muted); }
.music[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.music:active { transform: scale(.94); }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.eq i { width: 2.5px; height: 3px; background: currentColor; border-radius: 1px; transition: height .3s; }
.music[aria-pressed="true"] .eq i { animation: eq 1.1s ease-in-out infinite; }
.music[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: -.35s; animation-duration: .9s; }
.music[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: -.7s; animation-duration: 1.3s; }
.music[aria-pressed="true"] .eq i:nth-child(4) { animation-delay: -.2s; animation-duration: 1s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
@media (max-width: 380px) { .music .ml { display: none; } }

/* ---- item detail sheet ---- */
.row:not(.quest) .nm::after { content: "›"; color: var(--muted); margin-left: 6px; font-weight: 400; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(8, 6, 3, .62); opacity: 0; transition: opacity .25s ease; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-top: 1px solid var(--gold); border-radius: 18px 18px 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%);
  transition: transform .42s cubic-bezier(.2,.9,.25,1); box-shadow: 0 -12px 40px rgba(0,0,0,.45); }
.sheet.on { transform: none; }
@media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 560px; bottom: auto; top: 50%; border: 1px solid var(--gold); border-radius: 16px;
  transform: translate(-50%, -46%) scale(.96); opacity: 0; transition: transform .35s cubic-bezier(.2,.9,.25,1), opacity .25s; max-height: 86vh; }
  .sheet.on { transform: translate(-50%, -50%); opacity: 1; } .grab { display: none; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.sheet-x { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--raise); font-size: 1.1rem; line-height: 1; }
.sh-head { display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; padding-right: 36px; }
.sh-icon { width: 104px; height: 104px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; position: relative; overflow: hidden;
  background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--gold) 26%, transparent), transparent 68%), var(--bg); }
.sh-icon img { width: 92px; height: 92px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
.sh-icon.ready img { animation: iconIn .5s cubic-bezier(.3,1.4,.5,1) both; }
.sh-icon .ph { font: 400 2.2rem/1 var(--display); color: var(--gold); opacity: .55; }
@keyframes iconIn { from { opacity: 0; transform: scale(.7) rotate(-6deg); } }
.sh-title { font: 400 1.55rem/1.1 var(--display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.sh-sub { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.sh-done { margin-top: 10px; border: 1px solid var(--gold); color: var(--gold); background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .88rem; }
.sh-done[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.sh-done:active { transform: scale(.95); }
.sh-done.flash { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
.sh-sec { margin-top: 18px; }
.sh-sec > h4 { margin: 0 0 8px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.sh-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sh-chip { border: 1px solid var(--line); background: var(--raise); border-radius: 8px; padding: 4px 10px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.sh-chip b { color: var(--gold); margin-left: 4px; }
.sh-grade { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 6px; background: var(--gold); color: var(--gold-ink); font-weight: 700; margin-left: 6px; }
.sh-stats { display: grid; gap: 7px; }
.sh-stat { display: grid; grid-template-columns: 96px 1fr 44px; gap: 10px; align-items: center; font-size: .9rem; }
.sh-stat span:first-child { color: var(--muted); }
.sh-stat .tr { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.sh-stat .tr i { display: block; height: 100%; width: var(--v); background: var(--gold); border-radius: 3px; animation: fill .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k) * 45ms + 200ms); }
.sh-stat b { text-align: right; font-variant-numeric: tabular-nums; }
.sh-fx { margin: 0; }
.sh-desc { margin: 0; font-style: italic; line-height: 1.55; border-left: 2px solid var(--gold); padding-left: 12px; color: var(--fg); opacity: .92; }
.sh-where { margin: 0; color: var(--fg); font-size: .92rem; }
.sh-note { margin: 0; color: var(--muted); font-size: .85rem; }
.sheet.on .sh-sec { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
.sheet.on .sh-sec:nth-of-type(2) { animation-delay: .06s; } .sheet.on .sh-sec:nth-of-type(3) { animation-delay: .1s; }
.sheet.on .sh-sec:nth-of-type(4) { animation-delay: .14s; } .sheet.on .sh-sec:nth-of-type(n+5) { animation-delay: .18s; }
body.locked { overflow: hidden; }

/* ---- motion ---- */
.chip, .toggle, .danger, .region, .row input { transition: transform .15s ease, background-color .2s, border-color .2s, color .2s, box-shadow .2s; }
.chip:active, .toggle:active, .danger:active { transform: scale(.94); }
.region:hover { transform: translateY(-2px); box-shadow: 0 6px 18px -10px var(--gold); }
.region:active { transform: scale(.98); }
.row { position: relative; }
.row input:active { transform: scale(.85); }
.row.flash input { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
.row.flash input::after { animation: tick .3s .05s ease both; }
.row.flash { animation: glow 1s ease; }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.22); } 100% { transform: scale(1); } }
@keyframes tick { from { opacity: 0; transform: rotate(-45deg) translate(1px, -1px) scale(.3); } }
@keyframes glow { 0% { background: color-mix(in srgb, var(--gold) 22%, transparent); } 100% { background: transparent; } }

.burst { position: absolute; left: 12px; top: 24px; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; left: -2.5px; top: -2.5px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 6px var(--gold); animation: spark .6s cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes spark { 0% { transform: rotate(var(--a)) translateX(4px) scale(1); opacity: 1; }
  100% { transform: rotate(var(--a)) translateX(var(--r)) scale(.2); opacity: 0; } }

.row.leaving { animation: leave .42s ease forwards; overflow: hidden; }
@keyframes leave { 0% { opacity: 1; } 40% { opacity: 0; transform: translateX(24px); }
  100% { opacity: 0; transform: translateX(24px); max-height: 0; padding-block: 0; border-bottom-width: 0; } }

.tally b { display: inline-block; }
.tally.bump b { animation: bump .35s ease; }
@keyframes bump { 40% { transform: translateY(-3px) scale(1.15); } }
.bar.gain > i { background-image: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
  background-size: 35% 100%; background-repeat: no-repeat; animation: shimmer .9s ease; }
@keyframes shimmer { from { background-position: -50% 0; } to { background-position: 150% 0; } }

.cat-h.win h3 { animation: win 1.4s ease; }
.cat-h.win h3::after { content: " ✦"; }
@keyframes win { 0% { text-shadow: 0 0 0 transparent; } 30% { text-shadow: 0 0 14px var(--gold); transform: scale(1.04); } 100% { text-shadow: 0 0 0 transparent; } }

.enter > * { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
.enter > *:nth-child(2) { animation-delay: .05s; }
.enter > *:nth-child(3) { animation-delay: .1s; }
.enter .row { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 22ms + 80ms); }
.enter .region { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 30ms); }
.enter .region .bar > i { animation: fill .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 30ms + 150ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes fill { from { width: 0; } }

.banner { position: fixed; left: 0; right: 0; top: 38%; z-index: 20; pointer-events: none; text-align: center; padding: 22px 16px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 70%, transparent), var(--bg) 14%, var(--bg) 86%, color-mix(in srgb, var(--bg) 70%, transparent));
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  box-shadow: 0 0 60px 30px color-mix(in srgb, var(--bg) 60%, transparent);
  animation: banner 2.8s ease forwards; display: grid; gap: 6px; }
.banner::before, .banner::after { content: ""; position: absolute; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.banner::before { top: 0; } .banner::after { bottom: 0; }
.banner b { font: 400 clamp(1.7rem, 8vw, 2.8rem)/1.05 var(--display); color: var(--gold); letter-spacing: .1em; text-transform: uppercase;
  text-shadow: 0 0 22px color-mix(in srgb, var(--gold) 60%, transparent); }
.banner span { color: var(--fg); font-size: .9rem; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.08); filter: blur(4px); } 14% { opacity: 1; transform: none; filter: none; }
  78% { opacity: 1; } 100% { opacity: 0; transform: scale(.98); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <div class="brand">
      <h1>Tarnished's Ledger</h1>
      <div class="brand-r">
        <span class="tally" id="tally"><b>0</b> / 0 · 0%</span>
        <button class="music" id="music" aria-pressed="false" aria-label="Background music" title="Background music">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="ml">Music</span>
        </button>
      </div>

ep: Midway through the Stairs, turn right and enter the room. Enter the room on the right, and defeat the enemies to find the body that contains this weapon on the other side.","Upgrade: Normal",0],["30c7c748",15,2,"Daggers","Fire Knight's Shortsword","Shadow Keep","Has a 4.0% chance to drop by Fire Knights wielding this weapon in Shadow Keep.","Upgrade: Normal",0],["7ee83d70",15,2,"Great Spears","Messmer Soldier's Spear","Shadow Keep","Has a 2.00% chance to be dropped by Messmer Soldiers.","Upgrade: Normal",0],["4aacc2fb",15,2,"Heavy Thrusting Swords","Queelign's Greatsword","Shadow Keep","Shadow Keep: Use Iris of Occultation on the NPC in the Prayer Room to receive Queelign's Greatsword.","Upgrade: Normal",0],["4d02bb5a",15,2,"Medium Shields","Messmer Soldier Shield","Shadow Keep","Has a 2.00% chance to be dropped by Messmer Soldiers, from shield-wielding Messmer Soldiers.","Upgrade: Normal",0],["3035cc58",15,2,"Medium Shields","Golden Lion Shield","Shadow Keep","Shadow Keep: Given by Redmane Freyja after you hand her over the Letter for Freyja, received from Sir Ansbach.","Upgrade: Somber",0],["f18f68d0",15,2,"Sacred Seals","Fire Knight's Seal","Shadow Keep","Shadow Keep: In the area with the giant Queen Marika statue, it is behind the statue. You have to use the lever to lower the water level.","Upgrade: Normal",0],["24aed391",15,2,"Spears","Swift Spear","Shadow Keep","Can be found lying on a corpse guarded by 3 Messmer Soldiers along the road going South-East from the Castle Front site of grace.","Upgrade: Normal",0],["c4f8cf1d",15,2,"Thrusting Shields","Dueling Shield","Shadow Keep","Shadow Keep: From the Storehouse, First Floor site of grace, go North around the specimen pillar towards the stairs, and turn immediately left after going up them. Keep going straight until you see another staircase to your right (immediately past the room that Sir Ansbach moves to). Go to your left towards the large flight of stairs and go up them. Sneak past or kill the Fire Knight you see to your right. To his left you'll see a path. Go down it until you get to the bull-like specimen hanging from the ceiling. Keep your eye to the left and you'll see a corpse with the shield and a small section of wall that will let you get to the shield.","Upgrade: Normal",0],["699b1c62",15,2,"Thrusting Shields","Carian Thrusting Shield","Shadow Keep","Shadow Keep: From the \"Storehouse, Back Section\" site of grace, go west and you will reach a room where you find a Fire Knight and a few other enemies. The item is right past the Fire Knight and can be found on a corpse under the table.","Upgrade: Normal",0],["e1dc708f",15,2,"Axes","Death Knight's Twin Axes","Belurat & Gravesite Plain","Fog Rift Catacombs: The weapon is obtained as a reward for defeating the Death Knight boss.","Upgrade: Somber",0],["a4c4c894",15,2,"Backhand Blades","Backhand Blade","Belurat & Gravesite Plain","Beside a coffin, in the Inquisitor enemies area of Gravesite Plain, northeast from the Scorched Ruins site of grace.","Upgrade: Normal",0],["6b777c19",15,2,"Beast Claws","Beast Claw","Belurat & Gravesite Plain","Drops from killing Logur the Beast Claw in Gravesite Plains in the forest, southeast of the Gravesite Plain Site of Grace.","Upgrade: Normal",0],["1cc28a05",15,2,"Colossal Weapons","Anvil Hammer","Belurat & Gravesite Plain","Ruined Forge Lava Intake. Use the column you have lowered with the lever as a bridge and climb it until the end. Beware of the fire blob, and then at the top, turn right and jump to reach the stairs. Climb them up and interact with a furnace to obtain this weapon and an Ancient Dragon Smithing Stone.","Upgrade: Somber",0],["104c06c7",15,2,"Colossal Weapons","Bloodfiend's Arm","Belurat & Gravesite Plain","Guaranteed one-time drop from a Bloodfiend group in Prospect Town located at the Gravesite Plain.","Upgrade: Normal",0],["3c4691d7",15,2,"Crossbows","Spread Crossbow","Belurat & Gravesite Plain","Found on a body by the riverside and the Ellac Greatbridge. From the Castle Front site of grace, head east until you reach the rock wall, and then turn south, drop down the short cliff and continue south. Just after the first wooden stake fence, head west and drop down to three Messmer Soldiers. The Spread Crossbow is on a corpse in this camp.","Upgrade: Normal",0],["3f5a9ddb",15,2,"Fists","Pata","Belurat & Gravesite Plain","Found inside a hanging body, just outside the Church of Benediction.","Upgrade: Normal",0],["3fff07e1",15,2,"Fists","Poisoned Hand","Belurat & Gravesite Plain","Sewer Level of the Belurat Tower Settlement in Gravesite Plain.","Upgrade: Somber",0],["d5a113c1",15,2,"Flails","Serpent Flail","Belurat & Gravesite Plain","Fog Rift Fort: Head down using the ladder past the first tower, and defeat the enemies. Beware of the flamethrowers. Use spells or arrows if you have them. Reach the end of the area to find a chest that contains this item.","Upgrade: Somber",0],["97646d72",15,2,"Great Hammers","Black Steel Greathammer","Belurat & Gravesite Plain","Guaranteed drop from the Black Knight found at the Church of Consolation.","Upgrade: Normal",0],["5c7a9ab2",15,2,"Great Katanas","Great Katana","Belurat & Gravesite Plain","Gravesite Plain: The Great Katana can be found next to the sleeping Ghostflame Dragon on the lake, west of the Abandoned Ailing Village site of grace.","Upgrade: Normal",0],["3d88f8b1",15,2,"Greatshields","Black Steel Greatshield","Belurat & Gravesite Plain","Dropped by Black Knight Garrew that can be found by Fog Rift Fort. Random drop by any Black Knight.","Upgrade: Normal",0],["86503bba",15,2,"Greatswords","Greatsword of Solitude","Belurat & Gravesite Plain","Obtained after defeating the Blackgaol Knight. This boss is located inside the Western Nameless Mausoleum.","Upgrade: Somber",0],["7375e177",15,2,"Hammers","Flowerstone Gavel","Belurat & Gravesite Plain","The Dragon Communion Priestess drops this item at the Grand Altar of Dragon Communion after defeating Bayle The Dread.","Upgrade: Somber",0],["8035b16a",15,2,"Light Bows","Bone Bow","Belurat & Gravesite Plain","Belurat Tower Settlement: Can be found being protected by 2 giant Spider-Scorpions, inside the massive tower with a broken spiral staircase.","Upgrade: Normal",0],["9c9ff314",15,2,"Perfume Bottles","Chilling Perfume Bottle","Belurat & Gravesite Plain","Lamenter's Gaol: after using the Upper Gaol key on the door, descending the ladder, and walking into the room with the frozen floor, some Jar Innards will come out of a door to your right. The Chilling Perfume Bottle is in that room.","Upgrade: Normal",0],["5809ac65",15,2,"Spears","Bloodfiend's Fork","Belurat & Gravesite Plain","Has a 3.0% dropped from Bloodfiends who wield it (you can find two in a melee battle not far from Ruined Forge Lava Intake)","Upgrade: Normal",0],["a49482c1",15,2,"Straight Swords","Stone-Sheathed Sword","Belurat & Gravesite Plain","Can be acquired at one of the 3 Altar locations: Fog Rift Catacombs (on top of the 3 trap platforms and run to the furthest right corner); Ruins of Unte (flowery courtyard); Ancient Ruins of Rauh (on a tower connected by an invisible floor).","Upgrade: Somber",0],["de3b268",15,2,"Throwing Blades","Smithscript Dagger","Belurat & Gravesite Plain","Ruined Forge Lava Intake. Take the first ladder down, past the golem, and after the fire blob turn right. As soon as you enter the room past the Fire Blob, slightly to the left. You can also drop down to this area from the lever's location. At the end of the hallway, you will find a golem and this weapon on a corpse near the back wall.","Upgrade: Normal",0],["7e15a131",15,2,"Torches","Lamenting Visage","Belurat & Gravesite Plain","Inside a room on the lower level of the Lamenter's Gaol, hidden behind an illusory wall. In the area you fall through the floor, go up the stairs and into the the first doorway. Roll into the end of the passageway, and use the Gaol Lower Level Key to open the door.","Upgrade: Somber",0],["1d4cc3eb",15,2,"Twinblades","Euporia","Belurat & Gravesite Plain","Can be found in Belurat Tower Settlement","Upgrade: Somber",0],["425ef795",15,2,"Light Greatswords","Milady","Castle Ensis","Castle Ensis: The Milady Light Greatsword weapon can be found inside a chest. The chest is located at the top of a watchtower.","Upgrade: Normal",0],["d8e5b8a0",15,2,"Light Greatswords","Rellana's Twin Blades","Castle Ensis","Trade Remembrance of the Twin Moon Knight with Enia at the Roundtable Hold, to receive this weapon.","Upgrade: Somber",0],["236efcbf",15,2,"Medium Shields","Wolf Crest Shield","Castle Ensis","Can be found in: Castle Ensis. Located inside a storeroom you'll find a treasure chest that has the Wolf Crest Shield.","Upgrade: Normal",0],["50fc5afb",15,2,"Perfume Bottles","Firespark Perfume Bottle","Castle Ensis","Found in an elevated area South of the Castle Front Site of Grace, in a chest guarded by both Perfumers and Messmer Soldiers.","Upgrade: Normal",0],["ff704c51",15,2,"Thrusting Swords","Carian Sorcery Sword","Castle Ensis","In a chest after dropping down into Castle Ensis from Scadu Altus.","Upgrade: Normal",0],["90d11baa",15,2,"Axes","Smithscript Axe","Rauh & Enir-Ilim","Taylew's Ruined Forge: From the initial site of grace, continue following the path, get past the enemy, and take the ladder down then jump across the other platforms and turn left. You will find a Golem there. Behind it, at the back of the room, you will find the Smithscript Axe.","Upgrade: Normal",0],["294799fb",15,2,"Colossal Weapons","Devonia's Hammer","Rauh & Enir-Ilim","Dropped by Devonia, Crucible Knight near Rauh Ancient Ruins, East Grace.","Upgrade: Somber",0],["7c681de3",15,2,"Curved Greatswords","Horned Warrior's Greatsword","Rauh & Enir-Ilim","Guaranteed drop from the Wind-Aspected Horned Warrior towards the end of Enir-Ilim.","Upgrade: Somber",0],["17534ff6",15,2,"Fists","Golem Fist","Rauh & Enir-Ilim","Looted from Golems throwing stones in Taylew's Ruined Forge.","Upgrade: Normal",0],["6aebfa56",15,2,"Great Hammers","Smithscript Greathammer","Rauh & Enir-Ilim","Taylew's Ruined Forge: Use the giant platform in the middle to jump to the other side. Once there, keep moving forward and on the left side there will be a fire blob enemy protecting the item. Defeat the enemy and loot the corpse behind it to obtain the weapon.","Upgrade: Normal",0],["5213c2a9",15,2,"Great Spears","Bloodfiend's Sacred Spear","Rauh & Enir-Ilim","The Bloodfiend west of Taylew's Ruined Forge drops this when killed.","Upgrade: Somber",0],["cbf78e79",15,2,"Greataxes","Death Knight's Longhaft Axe","Rauh & Enir-Ilim","The weapon is obtained as a reward for defeating the Death Knight boss located at the Scorpion River Catacombs.","Upgrade: Somber",0],["73496d03",15,2,"Halberds","Poleblade of the Bud","Rauh & Enir-Ilim","Trade Remembrance of the Saint of the Bud with Enia to be able to receive this weapon. The remembrance is dropped by Romina, Saint of the Bud at the Church of the Bud.","Upgrade: Somber",0],["fa38c582",15,2,"Small Shields","Smithscript Shield","Rauh & Enir-Ilim","Taylew's Ruined Forge: Jump from the opening left to the Lever, and instead of heading forward turn left. There are two Smithing Golems there, one that uses fire. Once defeated, stick to the right and go up to the upper platform using the crumbled column. You will find the item at the end of the hallway. Beware of the fire blob that falls from the ceiling.","Upgrade: Normal",0],["a5ec95f",15,2,"Curved Swords","Spirit Sword","Cerulean Coast & Jagged Peak","You can find this weapon in Cerulean Coast. Northeast from the Cerulean Coast West site of grace, the entrance to a triangular ravine can be accessed. It's in the right corner in that lower area, near some demi-humans.","Upgrade: Somber",0],["d63c69f3",15,2,"Curved Swords","Dancing Blade of Ranah","Cerulean Coast & Jagged Peak","Dropped by defeating Dancer of Ranah at the Southern Nameless Mausoleum.","Upgrade: Somber",0],["2b250c43",15,2,"Great Katanas","Dragon-Hunter's Gr hadow (various)","Can be purchased from Thiollier for 6000 Runes.","Upgrade: Somber",0],["75fc15f9",15,2,"Reapers","Obsidian Lamina","Land of Shadow (various)","Complete the entirety of Sir Ansbach's questline by assisting him. This weapon will be available at the end of his questline after the Final Boss where he will be by the entrance to the arena after the fight.","Upgrade: Somber",0],["c35787a5",15,2,"Sacred Seals","Spiraltree Seal","Land of Shadow (various)","Reward for completing \"The Sacred Tower\" Painting Puzzle.","Upgrade: Normal",0],["5a952b55",15,2,"Straight Swords","Sword of Light","Land of Shadow (various)","Once acquired Stone-Sheathed Sword, the altar from which the sword is acquired will become inert, and the sword can then be transformed into the Sword of Darkness or Sword of Light at one of the 2 other Altars","Upgrade: Somber",0],["2baabcaf",15,2,"Straight Swords","Sword of Darkness","Land of Shadow (various)","Once acquired Stone-Sheathed Sword, the altar from which the sword is acquired will become inert, and the sword can then be transformed into the Sword of Darkness or Sword of Light at one of the 2 other Altars","Upgrade: Somber",0],["60a98783",15,3,"Dane's Set","Dane's Hat","Scadu Altus","Found under a waterfall in the lower portions under Bonny Village. This area can only be accessed by using the ladder in Shadow Keep to get down to a special teleport coffin. This will take you to Ruins of Unte and you must follow the cliffs downstream and then carefully drop down to bottom level to reach the area.","",0],["f9139d0e",15,3,"Death Knight Set","Death Knight Helm","Scadu Altus","Darklight Catacombs, on a Death Knight corpse. To get this armor set make your way in the catacombs until you reach the first elevator. Head down the elevator and into the next room where you can head down the staircase on the right. Make your way to the beginning of the next staircase where you will see a broken portion of the railing, where you’ll want to jump down. In the room behind you you should find the armor set on a death knight’s corpse laying in front of a large pit.","",0],["a9e7f03a",15,3,"High Priest Set","High Priest Hat","Scadu Altus","Dropped by Count Ymir, Mother of Fingers, who can be found in the Cathedral of Manus Metyr after interacting with the throne, you can only find Count Ymir there after you have defeated Metyr, Mother of Fingers.","",0],["39212daa",15,3,"Highland Warrior Set","Leather Crown","Scadu Altus","These parts of set can be found in the Scadu Altus, in a small orange forest east of the road leading to the Shadow Keep. From the Highroad Cross site of grace, head north until the road is joined by a path from the southeast, and then travel to the forest due east. The set is located in the center of the forest, to the west of a pond where Ralva the Great Red Bear roams.","",0],["a714832b",15,3,"Iron Rivet Set","Pelt of Ralva","Scadu Altus","Pelt of Ralva can be obtained after defeating Ralva the Great Red Bear, a gigantic bear found in Scadu Altus. Other parts are dropped by Red Bear, a humanoid boss. This boss can be found at the Northern Nameless Mausoleum. The Northern Nameless Mausoleum is located East of the Temple Ruins.","",0],["3aa0b944",15,3,"Night Set","Helm of Night","Scadu Altus","Bonny Gaol: Use the jar lift near the bridge twice to reach the top level of the gaol. First, hop on the jar, go to the bridge level, and activate the switch. Ride the jar lift for the second time to go to the top level. You can find the Night Set on a corpse laying on top of a table.","",0],["72c884a3",15,3,"Rakshasa Set","Rakshasa Helm","Scadu Altus","Dropped by Rakshasa in Eastern Nameless Mausoleum. This area can only be accessed by using the ladder in Shadow Keep to get down to a special teleport coffin (this Elden Ring Map location). This will take you to Ruins of Unte and you must follow the cliffs downstream and then carefully drop down to bottom level to reach the mausoleum.","",0],["644322f",15,3 r the battle, at the center of the boss arena, towards the golden orb. Select \"Touch Memory\" to trigger a cutscene. You'll obtain this item after the cutscene plays.","",0],["53e77d36",15,3,"Crucible Hammer-Helm","Crucible Hammer-Helm","Rauh & Enir-Ilim","Dropped by Devonia, Crucible Knight near Rauh Ancient Ruins, East Grace.","",0],["2adbc45c",15,3,"Gravebird Set","Gravebird's Blackquill Armor","Rauh & Enir-Ilim","From the Temple Town Ruins site of grace head north, past the Red Pests servants of rot, and stick to the left. The path will start to head upwards and you will find several Gravebirds. Continue upwards and you will eventually reach an area where there are gravebird statues at the side, in the middle, against the wall, you will find the armor.","",0],["6a3b13b2",15,3,"Highland Warrior Set","Leather Headband","Rauh & Enir-Ilim","These parts of set can be found in Rauh Base on a corpse lying atop a short cliff near the area where Rugalea the Great Red Bear roams. From the Ravine North Site of Grace, head northwest to the orange forest past the river. Head up the upper plain by using the toppled pillar and jump on top of it. Head west until you reach the edge of the plain to find the second set.","",0],["c9d539ae",15,3,"Imp Head (Lion)","Imp Head (Lion)","Rauh & Enir-Ilim","Scorpion River Catacombs. When you enter the area with two spiked ceilings and a run across a bridge under the gaze of a deadly basilisk. Cross the bridge towards the next lift, and stop at the end, then jump on the ledge to the left and follow it up towards the basilisk. Jump on the spiked ceiling as it drops and ride it up to a platform with this item.","",0],["f780ba52",15,3,"Young Lion's Set","Young Lion's Helm","Rauh & Enir-Ilim","Purchase from Finger Reader Enia at Roundtable Hold after defeating Promised Consort Radahn / Radahn, Consort of Miquella in Enir-Ilim.","",0],["ae0b5cb1",15,3,"Dancer's Set","Dancer's Hood","Cerulean Coast & Jagged Peak","Dropped by Dancer of Ranah in S p","Dropped by the Golden Hippopotamus by going up the elevator in the Shadow Keep Main Gate.","",0],["c79bbdfe",15,6,"Realm of Shadow","Wrath from Afar","Shadow Keep","Take the elevator at the Storehouse, Loft site of grace in Shadow Keep. Once you are on the upper level, turn left, and turn left again. As soon as you can turn right. Beware of the bat hanging from the ceiling. Reach the other side, and take the ladder up. Turn left and move towards the area in which there is a giant gear (the one that does not have a bat on it), once you are aligned fall down to find the spell behind the column.","",0],["ba817f30",15,6,"Realm of Shadow","Fire Serpent","Shadow Keep","Shadow Keep: From the \"Storehouse, Backsection\" site of grace, climb up the very long ladder, pass the enemies, and move forward past the book reading spirits until you reach the balcony. You will find the item there.","",0],["f6f10eef",15,6,"Realm of Shadow","Messmer's Orb","Shadow Keep","Can be selected as one of the possible rewards when trading Remembrance of the Impaler with Enia at the Roundtable Hold.","",0],["480ef53",15,6,"Realm of Shadow","Dragonbolt of Florissax","Belurat & Gravesite Plain","Received from Dragon Communion Priestess after giving her Thiollier's Concoction and progressing her questline.","",0],["43a4e00c",15,6,"Realm of Shadow","Electrocharge","Belurat & Gravesite Plain","In the Fog Rift Catacombs after the second lift down. Past the stake of Marika. In the room with the giant spike ceiling. In the second alcove on the left is a drop down take it. Take a left, when you're in the room take another left through the short hallway there's two mages and the electrocharge spell on a corpse.","",0],["2c9e995d",15,6,"Realm of Shadow","Ghostflame Breath","Belurat & Gravesite Plain","3x Dragon Heart can be used to at the Grand Altar of Dragon Communion to trade for this spell.","",0],["aecc9042",15,6,"Realm of Shadow","Watchful Spirit","Belurat & Gravesite Plain","Given by Hornsent Grandam after defeating the Divine Beast Dancing Lion. Talk to her twice with the Divine Beast Head equipped, to receive this incantation.","",0],["27bda31",15,6,"Realm of Shadow","Furious Blade of Ansbach","Rauh & Enir-Ilim","Complete Sir Ansbach's questline all the way through the end, and side with him when facing Leda, and then fight Promised Consort Radahn/ Radahn, Consort of Miquella. After the fight is over, Sir Ansbach's body will be near the Site of Grace, alongside with his equipment and this Incantation.","",0],["b2a6a44c",15,6,"Realm of Shadow","Heal from Afar","Rauh & Enir-Ilim","Can be looted on the ground by the foot of an underground golden tree. It is located in a cave path to the base of the Rauh Ruins, north-northeast of the Moorth Ruins in Scadu Atlus.","",0],["8f74161e",15,6,"Realm of Shadow","Aspects of the Crucible: Bloom","Rauh & Enir-Ilim","Can be found on a corpse near the Giant Miranda Sprout in the upper portions of Rauh Ruins. Starting at the \"Rauh Ancient Ruins, East\" site of grace, cross the bridge to the southeast. As soon as you get to the end of the bridge, but before going up the steps, turn north and keep going until you get to a gap that can be double jumped with torrent. The incantation is on the other side.","",0],["126a06f7",15,6,"Realm of Shadow","Roar of Rugalea","Rauh & Enir-Ilim","Dropped by Rugalea the Great Red Bear, located northwest of the \"Ravine North\" Site of Grace, in the wooded area with many Runebears on Rauh Base.","",0],["af533b5e",15,6,"Realm of Shadow","Knight's Lightning Spear","Rauh & Enir-Ilim","Scorpion River Catacombs: In the big hall with the second set of eyes that inflict deathblight upon you (the one after a ladder), at the end of the bridge, there is a ledge on the right side which lets you cross to the other side. Run across the ledge while hugging the wall and then go inside the opening behind the set of eyes. You can find the incantation in the room directly in front of you.","",0],["4af39b63",15,6,"Realm of Shadow","Pest-Thread Spears","Rauh & Enir-Ilim","From the Church of the Bud, Main Enterance grace, go North back into the cave and down the stairs, then take a right or left (it doesn't matter) and head behind the stairs, the incantation will be directly behind, guarded by one enemy.","",0],["8ffab56f",15,6,"Realm of Shadow","Divine Beast Tornado","Rauh & Enir-Ilim","Ancient Ruins of Rauh: This incantations drops from the Divine Beast Dancing Lion found northeast from the \"Temple Town Ruins\" Site of Grace.","",0],["df74192d",15,6,"Realm of Shadow","Divine Bird Feathers","Rauh & Enir-Ilim","Ancient Ruins of Rauh. Can be found the corpse in the middle of the lake. From Church of the Bud, Main Entrance site of grace, head north into the building, east down the central stairway and then south to outside. Go past the gazebo and look at the corpse in the middle of the water. Go towards it and then pick up the Divine Bird Feathers.","",0],["b6eeec02",15,6,"Realm of Shadow","Spira","Rauh & Enir-Ilim","Enir-Ilim: From First Rise Grace on a raised platform accessible from using tree branches. It would be on a small altar that is directly in front of statue.","",0],["77bca4bd",15,6,"Realm of Shadow","Multilayered Ring of Light","Cerulean Coast & Jagged Peak","Rewarded on defeating the spirit Misbegotten Crusader in the Stone Coffin Fissure.","",0],["47cf4186",15,6,"Realm of Shadow","Bayle's Tyranny","Cerulean Coast & Jagged Peak","Heart of Bayle can be used to at the Grand Altar of Dragon Communion to trade for Bayle's Flame Lightning or Bayle's Tyranny.","",0],["8146675b",15,6,"Realm of Shadow","Bayle's Flame Lightning","Cerulean Coast & Jagged Peak","Heart of Bayle can be used to at the Grand Altar of Dragon Communion to trade for Bayle's Flame Lightning or Bayle's Tyranny.","",0],["47ebaf33",15,6,"Realm of Shadow","Midra's Flame of Frenzy","Abyssal Woods & Midra's Manse","Can be selected as one of the possible rewards when trading Remembrance of the Lord of st ahead will be a rock wall with a hole just in front of it, as well as a goodly amount of Lesser Fingercreepers in front of, inside it and behind you on the wall. Drop down into the hole. A Colossal Fingercreeper will emerge and block your way, but you can run across to the safety of the exit tunnel if you are quick and mounted. The Ashes can be looted from the corpse in the middle of the arena.","",0],["738bb7c3",15,7,"","Swordhand of Night Jolán","Scadu Altus","Can be obtained after completing Count Ymir's questline. After defeating Count Ymir, rest at the Cathedral of Manus Metyr - Site of Grace and return to Jolan's location to see her slumped over the pillar instead of standing and leaning against it. Speak to her and give her the Iris of Grace.","",0],["7bb04162",15,7,"","Jolán and Anna","Scadu Altus","Get Swordhand of Night Jolán first. From the side of Scaduview (closest grace would be the Hinterland site of grace), head to the Shaman Village, from there you will find a pathway at the back of the village, travelling down the cliffside, leading to a secret top part of Rabbath's Rise. Here you will find her puppet body, where you will be asked to combine the spirits together, claiming this spirit summon.","",0],["4633db88",15,7,"","Fire Knight Hilde","Shadow Keep","Shadow Keep: From the gear in which you found Wrath from Afar, jump towards the next platform and head to the ladder on the left. Climb it up. Once at the top, take the wooden beam on your left and turn right towards the lift. Activate the lift but quickly return to the platform. Another lift will appear do the same, and jump on the first lift Roof. Stay there until it stops. Jump across the platform to reach the corpse on the other side and loot the Spirit Ash.","",0],["1dec6c23",15,7,"","Man-Fly Ashes","Shadow Keep","Spirit Ashes looted from a grub corpse in Village of the Flies. Can only be accessed by going down the river from Shadow Keep and unlocking the Recluses River Downstream site of grace area. The Ashes are found on the top part of the village, guarded by two shadow casters and several man-fly enemies.","",0],["6c7088c5",15,7,"","Bloodfiend Hexer's Ashes","Belurat & Gravesite Plain","Dropped by the Chief Bloodfiend Boss. Chief Bloodfiend can be found inside Rivermouth Cave. You can get to Rivermouth Cave by heading South from Temple Town Ruins site of grace and jumping down the coffin steps, or by heading northwest from Ellac River Cave.","",0],["8e9c113e",15,7,"","Demi-Human Swordsman Yosh","Belurat & Gravesite Plain","Dropped by the Demi-Human Swordmaster Onze boss. Demi-Human Swordmaster Onze can be found at the bottom of the Belurat Gaol. Players will find the entrance to this area by going to the lake west of the Belurat Tower Settlement. The entrance to the dungeon is littered with cages, making it easier to spot.","",0],["f484e475",15,7,"","Black Knight Commander Andreas","Belurat & Gravesite Plain","It's located by following the Fog Rift Catacombs past a black knight guarded by x3 Messmer Soldiers and then jumping onto the top of the spike trap the falls from the ceiling and then crossing it into a corridor. The Spirit Ashes is lying in a coffin.","",0],["f36dd5b9",15,7,"","Ancient Dragon Florissax","Belurat & Gravesite Plain","Give Thiollier's Concoction item to the dragon priestess (near Grand Altar of Dragon Communion) at night, this will put her to sleep. Wait for a few rounds and she will have woken up, exhaust her dialogue. Kill Bayle the Dread. Remember to summon Igon (his sign is within the arena, to the left after you enter the mist). Go to the Altar and talk to her, confess to putting her to sleep and accept to become her lord. collect her ash.","",0],["709d95f9",15,7,"","Spider Scorpion Ashes","Rauh & Enir-Ilim","Ancient Ruins of Rauh: In the area where the spider-scorpion hangs from a ceiling and there are a bunch of items on the ground. One of them is this.","",0],["d984d2e1",15,7,"","Inquisitor Ashes","Rauh & Enir-Ilim","found on a corpse in Enir-Ilim, beneath the second to last enemy before reaching the Spiral Rise site of grace (coming from First Rise site of grace).","",0],["2475080c",15,7,"","Black Knight Captain Huw","Rauh & Enir-Ilim","Scorpion River Catacombs: Found at the end of the L-shaped corridor with crushing spike traps. Past the first ceiling with the falling spikes, reach the Yellow Fulgurbloom and turn right, you will see x2 Messmer Soldiers and a Black Knight. Between both of you, there is another ceiling with spikes, be mindful when engaging in combat. Once those enemies are defeated, head to the coffin at the end to find the Spirit Ashes.","",0],["5f6d96d8",15,7,"","Taylew the Golem Smith","Rauh & Enir-Ilim","Taylew's Ruined Forge: Return to the platform in the middle that you have moved with the lever, and head up. Jump to the left once you are near the top. Take the stairs up in the area, and interact with the furnace to receive the Spirit Ashes along with an Ancient Dragon Smithing Stone.","",0],["bc4d2dd5",15,7,"","Divine Bird Warrior Ornis","Rauh & Enir-Ilim","Temple Town Ruins Site of Grace: Head north past the purple stones and Kindreds of Rot. Go Uphill and activate the spiritspring and use it to jump on ruins above.","",0],["4a2dfe6d",15,7,"","Horned Warrior Ashes","Rauh & Enir-Ilim","Can be found in Enir-Ilim after the Spiral Rise site of grace. You'll climb the spiral stairs, kill 4 birds and then jump off the stairs case onto another staircase below. The ashes will be on one of 3 items of the 3 corpses.","",0],["d623e299",15,7,"","Gravebird Ashes","Cerulean Coast & Jagged Peak","Charo's Hidden Grave: Use the spiritspring to reach the area, you'll find this item surrounded by gravestones.","",0],["87af5994",15,7,"","Fire Knight Queelign","Land of Shadow (various)","Give Fire Knight Queelign the Iris of Grace.","",0],["75cacfec",15,8,"Keen","Piercing Throw","Scadu Altus","Found on a scarab juust east of the Ruined Forge of Starfall Past Site of Grace. You'll find it guarded by a small group of Demi-Humans between a crumbled column.","",0],["51a4e698",15,8,"Magic","Carian Sovereignty","Scadu Altus","Acquired from a teardrop scarab inside a cave south west from Cathedral of Manus Metyr filled with glintslab fireflies. The scarab is located on the ceiling of the cave. To find this cave go to the Church District Highroad Site of Grace. Head directly west until you reach the cliffline and then continue south. The cave is embedded in the east cliff wall at the end of this path.","",0],["ef335fd8",15,8,"Sacred","Aspects of the Crucible: Wings","Scadu Altus","Fort of Reprimand: Black Knight Edredd drops this Ash of War upon defeat.","",0],["23dc007a",15,8,"Standard","Palm Blast","Scadu Altus","At the Moorth Ruins Site of Grace, use the \"May The Best Win\" emote in front of the DryLeaf Dane Monk, you will then begin a battle and winning will grant you the weapon and it's Ash of War.","",0],["62fc6e39",15,8,"Flame","Flame Spear","Shadow Keep","Shadow Keep, Sixth Floor: Climb the statues once you've used the lever to move them. Head outside, turn right and head up the stairs, turn left to find a Fire Knight at the end of the bridge. Drops this item and Winged Serpent Helm.","",0],["d8850ae3",15,8,"Standard","Wall of Sparks","Shadow Keep","Shadow Keep: Take the left lift down from the Storehouse, first-floor site of grace. take the first exit to the right, and then the first one to the left. You will find this item on a corpse sitting on the rails.","",0],["cbce5aab",15,8,"Standard","Rolling Sparks","Shadow Keep","This can be looted from a flying scarab on the eastern side of the large camp south of Shadow Keep. Ascend the hill past some perfumers and you'll find it at the top in the air above.","",0],["5db5e0ca",15,8,"Standard","Shield Strike","Shadow Keep","Found pre-equipped on Dueling Shield looted from a corpse in Shadow Keep.","",0],["cbf3dad8",15,8,"Cold","Divine Beast Frost Stomp","Belurat & Gravesite Plain","Obtained by trading Remembrance of the Dancing Lion with Enia at Roundtable Hold.","",0],["c8a48493",15,8,"Heavy","Savage Lion's Claw","Belurat & Gravesite Plain","From the Three-Path Cross site of grace in Gravesite Plain, stick to the wall on the left side, and follow the path north. You will eventually come across a small camp where you can find the Ash of War.","",0],["32ef6222",15,8,"Keen","Blind Spot","Belurat & Gravesite Plain","Comes equipped to the Backhand blade found besides a coffin, in the Inquisitor enemies area of Gravesite Plain, not far from the first site of grace.","",0],["35178e87",15,8,"Lightning","Blinkbolt","Belurat & Gravesite Plain","Found in a chest within the Fog Rift Catacombs. The room of the third spike dropper with a sorcerer sniping from the back, stand where the sorcerer you defeated was and bait the spike trap down to jump into a notch. Ride the notch up to a room with a chest that holds the ash of war.","",0],["491947bc",15,8,"Occult","Shriek of Sorrow","Belurat & Gravesite Plain","Can be found at Belurat Tower Settlement, in the main Plaza where Fire Knight Queelign invades you, behind the great tree located in the middle.","",0],["170844d0",15,8,"Quality","Wing Stance","Castle Ensis","Castle Ensis: Inside a chest in the tower that you can reach by jumping over the edge just outside Castle Lord's Chamber Site of Grace, and following the cliffside down to the tower before climbing up two ladders to reach it.","",0],["1c231e83",15,8,"Keen","Scattershot Throw","Rauh & Enir-Ilim","Can be found by killing a scarab. Just south of Taylew's Ruined Forge entrance, near a bridge. It's hanging high on a pillar with some mobs underneath it.","",0],["df1f2723",15,8,"Poison","The Poison Flower Blooms Twice","Rauh & Enir-Ilim","Dropped by a Teardrop Scarab. From Ravine North Site of Grace in Rauh Base, head south to cross river and find it near a small pool of rot near some ruins.","",0],["5d459608",15,8,"Standard","Dryleaf Whirlwind","Rauh & Enir-Ilim","From the Rauh Ancient Ruins, East site of grace, head northeast and you'll find it on an edge, besides a column and near a waterfall.","",0],["70cfe913",15,8,"Cold","Ghostflame Call","Cerulean Coast & Jagged Peak","Charo's Hidden Grave: Dropped by the Death Rite Bird.","",0],["e05ded74",15,8,"Standard","Igon's Drake Hunt","Cerulean Coast & Jagged Peak","Can be found by summoning Igon and then defeating Bayle The Dread, this will cause Igon to die at his previous location, just south-east of Foot of the Jagged Peak his body will have both Igon's Greatbow and Igon's set.","",0],["17d9b3fd",15,8,"Flame","Flame Skewer","Land of Shadow (various)","Acquired as a drop upon defeating the NPC Invader Fire Knight Queelign a second time.","",0],["c36ac028",15,8,"Heavy","Spinning Gravity Thrust","Land of Shadow (various)","Comes equipped to the Sword Lance, one of the possible rewards when trading Remembrance of the Wild Boar Rider with Enia at the Roundtable Hold.","",0],["10d91c7",15,8,"Keen","Raging Beast","Land of Shadow (various)","From the Bridge Leading to the Village Grace follow the path heading North. Once you get to the trees, keep looking east for a teleporting Teardrop Scarab that will have the Ash of War.","",0],["7fd52bb4",15,8,"Keen","Savage Claws","Land of Shadow (various)","Found on the Beast Claw (Weapon), which drops upon defeating Logur, the Beast Claw.","",0],["4e71808f",15,8,"Keen","Swift Slash","Land of Shadow (various)","Reward for siding with Hornsent during his fight with Leda at Shadowkeep.","",0],["f1b74725",15,8,"Keen","Overhead Stance","Land of Shadow (various)","Comes equipped to the Great Katana found next to the sleeping Ghostflame Dragon on the lake, west of the Greatbridge, North site of grace.","",0],["269bbdda",15,11,"","Oil-Soaked Tear","Scadu Altus","Coats nearby enemies with oil in mixed physick, Increases the Fire Dmg dealt to enemies by 20%, lasts 60 seconds","Drops from the Furnace Golem located at the Ruins of Unte.",0],["633eb7be",15,11,"","Bloodsucking Cracked Tear","Scadu Altus","Enhances attacks at the cost of HP in mixed physick, increases damage by 20%, drains [MaxHP*0.002+20] per second, lasts 180 seconds","Ruins of Unte: Defeat the Furnace Golem that requires to be lit by throwing a Hefty Furnace Pot on its furnace head. Killing the creature drops this item, along with x1 Furnace Visage.",0],["89a4cff1",15,11,"","Crimsonburst Dried Tear","Shadow Keep","Steadily restores 7 HP per second of nearby allies for a time in mixed physick, lasts 180 seconds","Drops from the Furnace Golem located around the army campsite, outside of the Shadow Keep.",0],["c070ab2b",15,11,"","Viridian Hidden Tear","Belurat & Gravesite Plain","Eliminates all stamina consumption in mixed physick, lasts 15 seconds","Drops from the Furnace Golem roaming around Ellac River.",0],["7ddea79a",15,11,"","Deflecting Hardtear","Belurat & Gravesite Plain","Enhances spontaneous guard in mixed physick, lasts 300 seconds","Drops from the Furnace Golem located along the main road near the Scorched Ruins.",0],["1884e116",15,11,"","Crimson-Sapping Cracked Tear","Rauh & Enir-Ilim","Grants attacks HP-restoring effect (0.75% of the maximum HP upon each hit) in mixed physick, lasts 45 seconds","drops from the Furnace Golem located in the west section of Ancient Ruins of Rauh.",0],["94ef0ef3",15,11,"","Cerulean-Sapping Cracked Tear","Cerulean Coast & Jagged Peak","Grants attacks FP-restoring (5 FP upon each hit) effect in mixed physick, lasts 45 seconds","Drops from the Furnace Golem located east of the Cathedral of Manus Metyr within the Scadu Atlus region.",0],["33f1188",15,11,"","Glovewort Crystal Tear","Cerulean Coast & Jagged Peak","Enhances attacks of spirits by 7.5% in mixed physick, lasts 180 seconds","Drops from the Furnace Golem located around Charo's Hidden Grave.",0],["e34d88f7",15,15,"Real of Shadow: NPCs' Bell Bearings","Ymir's Bell Bearing","Scadu Altus","Obtained by killing Count Ymir in Cathedral of Manus Metyr.","",0],["cd21db30",15,15,"Real of Shadow: Seller's Bell Bearings","Spellmachinist's Bell Bearing","Scadu Altus","Starting at Shaman Village head southeast and follow the path to the lower peak, from here carefully jump down the ledges until you overlook Rabbath's Rise. Carefully jump to the balcony below and enter the room, jump to the lower level and you will see a body containing the bell bearing.","",0],["9e98c0ca",15,15,"Real of Shadow: Seller's Bell Bearings","Herbalist's Bell Bearing","Belurat & Gravesite Plain","Found on the west wall of the ravine between Pillar Path Waypoint and Dragon's Pit Sites of Grace in Gravesite Plain.","",0],["2d72e057",15,15,"Real of Shadow: Seller's Bell Bearings","Mushroom-Seller's Bell Bearing [2]","Belurat & Gravesite Plain","In a jar hanging off a cliff-side waterfall south of the Ellac River Downstream Grace.","",0],["10c51950",15,15,"Real of Shadow: Seller's Bell Bearings","String-Seller's Bell Bearing","Belurat & Gravesite Plain","Hanging from a wall in a ravine in Prospect Town in the Shadow Lands. Shoot and break the hanging pot with a bow.","",0],["daeffc0",15,15,"Real of Shadow: Seller's Bell Bearings","Mushroom-Seller's Bell Bearing [1]","Rauh & Enir-Ilim","From the Temple Town Ruins Site of Grace in the Rauh Ruins, head south east along the water, which will terminate in a waterfall. To the south west of the waterfall there will be several large gravestones along the cliffside, navigate down the gravestones to the pond at the bottom. Head west following the base of the cliff and look for a black pot hanging by a rope on the side of the cliff wall. Destroy the pot to make it drop the Bell Bearing.","",0],["dc58badb",15,15,"Real of Shadow: Seller's Bell Bearings","Igon's Bell Bearing","Cerulean Coast & Jagged Peak","Found on the body of Igon after killing Bayle The Dread. His body is found where you last spoke to him, near the double Jagged Peak Drake fight.","",0],["970a59dd",15,15,"Real of Shadow: NPCs' Bell Bearings","Moore's Bell Bearing","Land of Shadow (various)","Can be acquired as a reward for completing Moore's side quest.","",0],["fb9cbc9b",15,15,"Real of Shadow: Seller's Bell Bearings","Greasemonger's Bell Bearing","Land of Shadow (various)","It can be found north of the Bridge Leading to the Village grace. Go past the giant, follow the road, and look for a pack of wolves on the left. The pot containing the bell bearing is hanging near them.","",0],["d756653e",15,15,"Real of Shadow: Seller's Bell Bearings","Moldmonger's Bell Bearing","Land of Shadow (various)","Inside a pot hanging from a rock wall right next to the Recluse’s River Downstream grace. Shoot it down with a bow and drop down from the graves sticking out from the waterfall to grab it.","",0],["52aadeb3",15,19,"Scadutree Fragments","Scadutree Fragments","Scadu Altus","(x1) Can be found by Miquella's Cross of the Highroad Cross Site of Grace and NPCs Hornsent and Needle Knight Leda.","",0],["d16f3d4d",15,19,"Scadutree Fragments","Scadutree Fragments","Scadu Altus","(x1) Northwest of the Moorth Ruins Site of Grace, there is a Messmer Soldiers encampment. 1 Scadutree Fragment can looted by the statue of Marika.","",0],["23b93f33",15,19,"Scadutree Fragments","Scadutree Fragments","Scadu Altus","(x2) Can looted off the ground. The item is found inside the Church of the Crusade, just by the foot of the statue of Marika.","",0],["9bab1e73",15,19,"Scadutree Fragments","Scadutree Fragments","Scadu Altus","(x1) Head north from Moorth Ruins to find an area with a pond and a cave entrance that leads to Rauh Ruins. Cross the pond, and just before the entrance to the cave, you'll find 1 Scadutree Fragment that can be looted by the statue of Marika.","",0],["73b44dfc",15,19,"Scadutree Fragments","Scadutree Fragments","Scadu Altus","(x1) Can be looted from the ground by Miquella's Cross of the Moorth Ruins Site of Grace.","",0],["7a8ac8ae",15,19,"Scadutree Fragments","Scadutree Fragments","Scadu Altus","(x1) South of Moorth Ruins, you'll find a pot-bearing Shadow towards the giant fissure at the center of the location. Instead of dropping down, wrap around the south side of the fissure to find the enemy. Kill the pot-bearing Shadow enemy to acquire 1 Scadutree Fragment.","",0],["42d6ce0d",15,19,"Scadutree Fragments","Scadutree Fragments","Scadu Altus","(x1) Can be looted from the ground by Miquella's Cross of the Scaduview Cross Site of Grace.","",0],["1ed6cdce",15,19,"Revered Spirit Ashes","Revered Spirit Ashes","Scadu Altus","(x1) Once you enter the Village of Flies, continue down the path, it can be found on a body laid on a pedestal.","",0],["201a7c10",15,19,"Revered Spirit Ashes","Revered Spirit Ashes","Scadu Altus","(x1) Found on the altar by the stone wall southeast from Ruins of Unte.","",0],["5fe8e61c",15,19,"Scadutree Fragments","Scadutree Fragments","Shadow Keep","(x1) Can be found next to the statue of Marika, located at a Messmer Soldier encampment.","",0],["63237ce2",15,19,"Scadutree Fragments","Scadutree Fragments","Shadow Keep","(x1) Can be looted by the statue of Marika located at the Messmer Soldiers encampment situated along the main entrance of the Shadow Keep. If you aggroed the Furnace Golem in this area, chances are the creature can destroy the statue. But you can still find the Scadutree Fragment there.","",0],["91d017a2",15,19,"Scadutree Fragments","Scadutree Fragments","Shadow Keep","(x2) There are two Lesser Lesser Golden Hippopotamus enemies found in this area, drop a Scadutree Fragment each. A Scadutree Fragment drops from the Hippopotamus enemies in the area. This area can only be accessed by using the ladder in Shadow Keep to get down to a special teleport coffin. This will take you to Ruins of Unte and you must follow the cliffs downstream, and then carefully drop down to the bottom level to reach it.","",0],["a51c7e9d",15,19,"Scadutree Fragments","Scadutree Fragments","Shadow Keep","(x2) Obtained after defeating the Golden Hippopotamus boss found at the Main Plaza of the Shadow Keep.","",0],["d68d2f19",15,19,"Scadutree Fragments","Scadutree Fragments","Shadow Keep","(x1) Can be looted by Miquella's Cross of the Storehouse, Fourth Floor Site of Grace in the Specimen Storehouse section of the Shadow Keep.","",0],["b250011b",15,19,"Scadutree Fragments","Scadutree Fragments","Shadow Keep","(x1) Located at the Church District of the Shadow Keep. 1 Scadutree Fragment can be looted on the hand of the statue of Marika. Time your jump to grab it. This is easily done after draining the water, or if you are feeling brave you can actually jump onto the hand before draining the water. and jump back.","",0],["f4ad9f1d",15,19,"Scadutree Fragments","Scadutree Fragments","Shadow Keep","(x1) Can be looted in front of a small statue of Marika, located in the Dark Chamber entrance of the Shadow Keep's Specimen Storehouse.","",0],["32c6cb1e",15,19,"Scadutree Fragments","Scadutree Fragments","Shadow Keep","(x1) From the Back Gate Site of Grace of the Shadow Keep, enter the room to your right to find 1 Scadutree Fragment that can be looted on the ground, by the foot of the statue of Marika.","",0],["6d4cdd5a",15,19,"Scadutree Fragments","Scadutree Fragments","Belurat & Gravesite Plain","(x1) Can be found by the Miquella's Cross of the Three-Path Cross Site of Grace.","",0],["7dcc62f9",15,19,"Scadutree Fragments","Scadutree Fragments","Belurat & Gravesite Plain","(x2) Can be found at the Church of Consolation's by the statue of Marika.","",0],["93f24ed7",15,19,"Scadutree Fragments","Scadutree Fragments","Belurat & Gravesite Plain","(x1) Can be found by Miquella's Cross of the Main Gate Cross Site of Grace near NPCs Sir Ansbach and Moore.","",0],["a98cb81b",15,19,"Scadutree Fragments","Scadutree Fragments","Belurat & Gravesite Plain","(x1) Dropped by a pot-bearing Shadow enemy in a gravesite that sparkles and runs away. Kill it quickly to get the drop.","",0],["8ef47d20",15,19,"Scadutree Fragments","Scadutree Fragments","Belurat & Gravesite Plain","(x1) Item drops from a pot-bearing Shadow enemy. Grants 707 Runes upon defeat. Drops 1 Scadutree Fragment and 1 Silver Horn Tender. In a gravesite area, southwest of Cliffroad Terminus Site of Grace. Surrounded by other shadow enemies and a dog.","",0],["66cd9870",15,19,"Scadutree Fragments","Scadutree Fragments","Belurat & Gravesite Plain","(x1) Can be looted from the ground beside Miquella's Cross of the Pillar Path Cross Site of Grace.","",0],["c97b1870",15,19,"Revered Spirit Ashes","Revered Spirit Ashes","Belurat & Gravesite Plain","(x1) On a small altar. North-east of the Gravesite plain site of grace. Past the white tree filled with hanging bodies.","",0],["dabc32c1",15,19,"Revered Spirit Ashes","Revered Spirit Ashes","Belurat & Gravesite Plain","(x1) After defeating the Divine Beast Dancing Lion, head to the right side of the arena to find a lift. Take the lift up and proceed forward to open a large door. Once through, you will find the altar nearby that has a Revered Spirit Ash.","",0],["89c9115b",15,19,"Revered Spirit Ashes","Revered Spirit Ashes","Belurat & Gravesite Plain","(x1) Can be found on an altar in the Ellac River Cave near the Site of Grace.","",0],["d492a1e3",15,19,"Scadutree Fragments","Scadutree Fragments","Castle Ensis","(x1) Can be found beside Miquella's Cross of the Castle Ensis Checkpoint Site of Grace.","",0],["80ad521d",15,19,"Scadutree Fragments","Scadutree Fragments","Rauh & Enir-Ilim","(x1) From the Rauh Ancient Ruins, West Site of Grace, head towards the building and climb up the stairs. Beware of the enemies in this room. Reach the end to find 1 Scadutree Fragment in front of the large altar.","",0],["54a74f1c",15,19,"Scadutree Fragments","Scadutree Fragments","Rauh & Enir-Ilim","(x1) Can be looted by Miquella's Cross of the Rauh Ancient Ruins, East Site of Grace.","",0],["4b0eeb56",15,19,"Scadutree Fragments","Scadutree Fragments","Rauh & Enir-Ilim","(x1) From the First Rise Site of Grace of Enir-Ilim, progress the area until you're about to reach the Spiral Rise Site of Grace. Near the checkpoint, you'll find a stairway that leads down to a room where you can loot the Inquisitor Ashes. Outside of this room, jump down onto a broken staircase that might look like a dead-end. Check the east side of this staircase to drop onto the narrow edge of the wall. Wrap along the side of it until you reach a platform that has a body holding 10 Golem's Great Arrow. Look south and do a running jump to jump across the pit and towards a window. Drop down to formally arrive in a secret section of Belurat Tower Settlement. Continue forward from here until you find a covered statue where you'll find 1 Scadutree Fragment by the foot of the statue.","",0],["2ebc536a",15,19,"Scadutree Fragments","Scadutree Fragments","Rauh & Enir-Ilim","(x1) Outer Tower of Enir-Ilim. After picking up the previous Revered Spirit Ash, continue heading up the stairs and you'll find a room with an altar where 1 Scadutree Fragment can be picked up.","",0],["8db3b490",15,19,"Revered Spirit Ashes","Revered Spirit Ashes","Rauh & Enir-Ilim","(x1) South of Temple Town Ruins, you will see the altar near the edge.","",0],["1d536a09",15,19,"Revered Spirit Ashes","Revered Spirit Ashes","Rauh & Enir-Ilim","(x1) Dropped by the Shadow Pothead in the area, along with 1 Silver Horn Tender, 1 Dewgem, and 1 Rauh Burrow.","",0],["fefe59d7",15,19,"Scadutree Fragments","Scadutree Fragments","Cerulean Coast & Jagged Peak","(x1) Can be looted from the ground by Miquella's Cross of the Cerulean Coast Cross Site of Grace.","",0],["f4eb496d",15,19,"Scadutree Fragments","Scadutree Fragments","Cerulean Coast & Jagged Peak","(x1) Can looted from the ground by Miquella's Cross of the Fissure Cross Site of Grace.","",0],["5dbbfe7d",15,19,"Scadutree Fragments","Scadutree Fragments","Cerulean Coast & Jagged Peak","(x1) Dropped by the Lesser Golden Hippopotamus enemy found in this area of Charo's Hidden Grave.","",0],["4e0d778e",15,19,"Scadutree Fragments","Scadut
